[package]
name = "apparent-connect-client"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
# Synthetic transport scenarios reused by the application's real-provider tests.
test-support = ["apparent-config-native/test-support"]

[dependencies]
apparent-config-native = { path = "../../shared/config-native" }
# Maintained X25519 release line; 0.12 adds unconditional P256/HPKE and
# crypto-bigint 0.5.x (RUSTSEC-2026-0387), even with all features disabled.
age = { version = "=0.11.5", default-features = false }
ed25519-dalek = "=3.0.0"
zeroize = "=1.9.1"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
apparent-config-native = { path = "../../shared/config-native", features = ["test-support"] }
