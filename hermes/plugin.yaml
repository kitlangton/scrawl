name: apparent
version: "0.1.0"
description: Inspect Apparent recordings with timestamped instructions and visual evidence.
author: Apparent
requires_hermes: ">=0.22.1"
python_dependencies:
  - "Pillow>=10.2,<13"
provides_tools: [apparent_inspect, apparent_zoom, apparent_frame, apparent_status]
provides_hooks: [pre_llm_call]
provides_middleware: []
requires_env: []
config_schema:
  executable:
    type: string
    default: ""
    description: Absolute path to the installed Apparent app CLI; empty discovers the installed app.
