[package]
name = "apparent-capture"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "lib.rs"

[[bin]]
name = "apparent-capture"
path = "main.rs"
required-features = ["client"]

[features]
default = ["client"]
provider-wire = []
client = ["provider-wire", "dep:clap", "dep:serde_json"]

[dependencies]
anyhow = "1.0.104"
libc = "0.2.189"
serde_json = { version = "1.0.151", optional = true }
clap = { version = "4.6.7", features = ["derive"], optional = true }
