[package]
name = "scrawl"
version = "0.3.13"
edition = "2024"
default-run = "scrawl"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18.2"
dirs = "7.0.0"
flume = "0.12.0"
hound = "3.5.1"
libc = "0.2.189"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
core-foundation = "0.10.0"
core-graphics = "0.24.0"
core-graphics-types = "0.1.3"
core-text = "21.0.0"
core-video = "0.4.3"
gpui = { version = "0.2.2", default-features = false, features = ["font-kit"] }
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSPasteboard", "NSPasteboardItem"] }
objc2-core-foundation = "0.3.2"
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSData", "NSString"] }
objc2-quartz-core = { version = "0.3.2", features = ["CALayer"] }
metal = "0.29.0"
screencapturekit = { version = "=11.0.0", features = ["macos_15_0"] }
# Rune (anomalyco/rune), pinned to a `dev` rev and bumped deliberately. Only `scrawl lab pill --rune`
# uses it for now; the app's normal run path stays on GPUI.
rune = { git = "https://github.com/anomalyco/rune", rev = "9717c0361d95c0e146e099106e0c65e356e83896", features = ["macos-background-cursor"] }

[target.'cfg(target_os = "windows")'.dependencies]
ab_glyph = "0.2.32"
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "windows-manifest"] }
lyon = "1.0.19"
raw-window-handle = "0.6.2"
sha2 = "0.10.9"
# `dynamic-backends`: ggml's CPU code ships as one DLL per x86 tier (ggml-cpu-haswell.dll,
# ggml-cpu-skylakex.dll, ...) and the best one this CPU runs is loaded at run time. A static build
# compiles it for the build machine (GGML_NATIVE): CI's AVX-512 runner, which crashed on CPUs
# without AVX-512 (#58).
transcribe-cpp = { version = "=0.2.4", default-features = false, features = ["dynamic-backends"] }
tray-icon = { version = "0.24.1", default-features = false }
windows = { version = "0.61.3", features = [
  "Wdk_System_SystemServices",
  "Win32_System_SystemInformation",
  "Win32_System_LibraryLoader",
  "Foundation",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media_MediaFoundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Kernel",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Performance",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "3"

[profile.dev]
debug = 0
opt-level = 2

[profile.dev.package."*"]
opt-level = 2

