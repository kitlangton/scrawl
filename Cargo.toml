[package]
name = "apparent"
version = "0.3.13"
edition = "2024"
default-run = "apparent"
license = "MIT"

[[bin]]
name = "apparent"
path = "main.rs"

[dependencies]
apparent-connect-client = { path = "connect/client" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18.2"
dirs = "7.0.0"
flume = "0.12.0"
hound = "3.5.1"
libc = "0.2.189"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
apparent-connect-client = { path = "connect/client", features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
core-foundation = "0.10.0"
core-graphics = "0.24.0"
core-graphics-types = "0.1.3"
core-text = "21.0.0"
core-video = "0.4.3"
gpui = { version = "0.2.2", default-features = false, features = ["font-kit"] }
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSPasteboard", "NSPasteboardItem"] }
objc2-core-foundation = "0.3.2"
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSData", "NSString"] }
objc2-quartz-core = { version = "0.3.2", features = ["CALayer"] }
metal = "0.29.0"
screencapturekit = { version = "=11.0.0", features = ["macos_15_0"] }

[target.'cfg(target_os = "windows")'.dependencies]
ab_glyph = "0.2.32"
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "windows-manifest"] }
lyon = "1.0.19"
raw-window-handle = "0.6.2"
sha2 = "0.10.9"
# `dynamic-backends`: ggml's CPU code ships as one DLL per x86 tier (ggml-cpu-haswell.dll,
# ggml-cpu-skylakex.dll, ...) and the best one this CPU runs is loaded at run time. A static build
# compiles it for the build machine (GGML_NATIVE): CI's AVX-512 runner, which crashed on CPUs
# without AVX-512 (#58).
transcribe-cpp = { version = "=0.2.4", default-features = false, features = ["dynamic-backends"] }
tray-icon = { version = "0.24.1", default-features = false }
windows = { version = "0.61.3", features = [
  "Wdk_System_SystemServices",
  "Win32_System_SystemInformation",
  "Win32_System_LibraryLoader",
  "Foundation",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media_MediaFoundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Kernel",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Performance",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "3"

[target.'cfg(target_os = "linux")'.dependencies]
ab_glyph = "0.2.32"
arboard = { version = "3.6.1", default-features = false, features = ["image-data"] }
ashpd = { version = "0.11", default-features = false, features = ["async-std"] }
futures-lite = "2"
# X11 only: GPUI 0.2.2's Wayland windows can't be placed or kept on top, so Apparent's windows
# go through XWayland on a Wayland session (see capture/desktop/docs/linux/linux.md).
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "x11"] }
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
lyon = "1.0.19"
sha2 = "0.10.9"
# Runtime CPU selection; never compile ggml for the CI runner's CPU (#82).
# x86_64 gets one module per ISA tier; aarch64 gets a portable CPU module.
transcribe-cpp = { version = "=0.2.4", default-features = false, features = ["dynamic-backends"] }
x11rb = { version = "0.13.1", features = ["allow-unsafe-code", "randr", "shape", "xfixes", "xinput", "xtest", "res"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[profile.dev]
debug = 0
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
