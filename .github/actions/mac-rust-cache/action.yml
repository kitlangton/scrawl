name: Normalize tested Mac cache toolchain inventory
description: Remove only the known unused hosted-image compiler before dependency cache lookup
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        test "$GITHUB_ACTIONS" = true
        test "$RUNNER_ENVIRONMENT" = github-hosted
        test "$RUNNER_OS" = macOS
        test "$RUNNER_ARCH" = X64
        selected=1.99.1-x86_64-apple-darwin
        legacy=stable-x86_64-apple-darwin
        expected='1.99.1 x86_64-apple-darwin 58cf8f9c35b355199727627d07ae34a4e2846d67'
        old='1.98.0 x86_64-apple-darwin 88d9e12ae178fab0fb5cc050a94da85685d449ea'
        identity() {
          local details release host commit
          details=$("$@")
          release=$(printf '%s\n' "$details" | sed -n 's/^release: //p')
          host=$(printf '%s\n' "$details" | sed -n 's/^host: //p')
          commit=$(printf '%s\n' "$details" | sed -n 's/^commit-hash: //p')
          printf '%s %s %s\n' "$release" "$host" "$commit"
        }
        active=$(rustup show active-toolchain)
        test "${active%% *}" = "$selected"
        test "$(identity rustc -vV)" = "$expected"
        test "$(identity rustup run "$selected" rustc -vV)" = "$expected"
        inventory=$(rustup toolchain list --quiet)
        printf 'Installed toolchains before cache preparation:\n%s\n' "$inventory"
        found_selected=0
        found_legacy=0
        while IFS= read -r toolchain; do
          case "$toolchain" in
            "$selected") test "$found_selected" = 0; found_selected=1 ;;
            "$legacy") test "$found_legacy" = 0; found_legacy=1 ;;
            *) echo 'Unexpected toolchain inventory; refusing mutation' >&2; exit 1 ;;
          esac
        done <<< "$inventory"
        test "$found_selected" = 1
        remove_legacy=0
        if [ "$found_legacy" = 1 ]; then
          legacy_identity=$(identity rustup run "$legacy" rustc -vV)
          case "$legacy_identity" in
            "$expected") ;;
            "$old") remove_legacy=1 ;;
            *) echo 'Unexpected stable compiler; refusing mutation' >&2; exit 1 ;;
          esac
        fi
        if [ "$remove_legacy" = 1 ]; then
          rustup toolchain uninstall "$legacy"
          inventory="$selected"
        fi
        # A failed or partial uninstall must never advance to cache restore.
        test "$(rustup toolchain list --quiet)" = "$inventory"
        active=$(rustup show active-toolchain)
        test "${active%% *}" = "$selected"
        test "$(identity rustc -vV)" = "$expected"
        printf 'Installed toolchains admitted for cache:\n%s\n' "$inventory"
        rustc -vV
