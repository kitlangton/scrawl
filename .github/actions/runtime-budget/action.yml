name: Whole-workflow runtime audit
description: Fail closed if the completed workflow workload exceeded its execution budget.
inputs:
  platform:
    description: Supported workload platform (linux or macos)
    default: linux
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        WORKFLOW_BUDGET_PLATFORM: ${{ inputs.platform }}
      run: node --experimental-strip-types enablement/verification/workflow-budget.ts
