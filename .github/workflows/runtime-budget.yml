name: Workflow runtime watchdog

# Trusted default-branch controller; never checks out the observed candidate.
on:
  workflow_run:
    workflows:
      - Linux verification
      - Mac verification
      - Focused Mac Connect native proof
      - Linux updater harness
      - Release (Linux)
      - Mac preview release
      - Website and Connect — checks & deploy
    types: [in_progress]

permissions:
  contents: read
  actions: write

concurrency:
  group: runtime-watchdog-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  watch:
    if: github.event.workflow_run.repository.full_name == github.repository && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    # Controller wait ceiling, not an extension of the observed 10m workload.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cancel the exact observed run when execution reaches ten minutes
        env:
          GH_TOKEN: ${{ github.token }}
          BUDGET_RUN_ID: ${{ github.event.workflow_run.id }}
          BUDGET_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: node --experimental-strip-types enablement/verification/workflow-budget.ts --watch
