name: Connect producer
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      producer-run:
        description: Canonical successful Connect producer run to admit
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
permissions:
  contents: read
  actions: read
jobs:
  select:
    if: inputs.producer-run == '' && github.repository == 'tryapparent/apparent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      selected-run: ${{ steps.select.outputs.selected-run }}
      build: ${{ steps.select.outputs.build }}
      applicable: ${{ steps.select.outputs.applicable }}
    env:
      NODE_ENV: production
      VITE_HOSTED_API_ORIGIN: https://hosted.tryapparent.com
      PUBLIC_POSTHOG_ENABLED: ${{ vars.PUBLIC_POSTHOG_ENABLED || 'true' }}
      PUBLIC_POSTHOG_TOKEN: ${{ vars.PUBLIC_POSTHOG_TOKEN }}
      PUBLIC_POSTHOG_HOST: https://eu.i.posthog.com
      PUBLIC_POSTHOG_ENVIRONMENT: production
    steps:
      - name: Verification runtime budget and ownership
        run: echo '10 minute whole-workflow execution budget; agent whose run hits the limit owns optimization and a successful rerun. Do not raise or bypass the limit.'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types connect/delivery/select.ts
      - name: Record concrete selection
        env:
          SELECTED_RUN: ${{ steps.select.outputs.selected-run }}
        run: |
          node -e 'require("fs").writeFileSync("connect-selection.json", JSON.stringify({schema:1, selectedRun:process.env.SELECTED_RUN}))'
      - uses: actions/upload-artifact@v4
        with:
          name: connect-selection-${{ github.sha }}
          path: connect-selection.json
          if-no-files-found: error
  produce:
    needs: select
    if: needs.select.outputs.build == 'true' && inputs.producer-run == '' && github.repository == 'tryapparent/apparent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NODE_ENV: production
      VITE_HOSTED_API_ORIGIN: https://hosted.tryapparent.com
      PUBLIC_POSTHOG_ENABLED: ${{ vars.PUBLIC_POSTHOG_ENABLED || 'true' }}
      PUBLIC_POSTHOG_TOKEN: ${{ vars.PUBLIC_POSTHOG_TOKEN }}
      PUBLIC_POSTHOG_HOST: https://eu.i.posthog.com
      PUBLIC_POSTHOG_ENVIRONMENT: production
    steps:
      - name: Set runner evidence paths
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "CONNECT_EVIDENCE=$RUNNER_TEMP/connect-browser-evidence" >> "$GITHUB_ENV"
      - name: Verification runtime budget and ownership
        run: echo '10 minute whole-workflow execution budget; agent whose run hits the limit owns optimization and a successful rerun. Do not raise or bypass the limit.'
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Locked dependencies and browsers
        env:
          NODE_ENV: development
        run: |
          (cd connect/service && npm ci --include=dev)
          (cd connect/web && bun install --frozen-lockfile)
          (cd connect/web && ./node_modules/.bin/playwright-core install --with-deps chromium firefox)
          cd connect/web
          echo "CHROME_PATH=$(node --input-type=module -e 'import {chromium} from "playwright-core"; console.log(chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Verify producer contracts
        run: node --experimental-strip-types --test connect/delivery/*.test.ts
      - name: Verify service
        run: cd connect/service && npm test
      - name: Verify browser and analytics
        run: |
          node --experimental-strip-types --test shared/analytics/config.test.ts
          cd connect/web && npm test
      - name: Seal verified production outputs
        run: |
          for kind in browser worker; do mkdir -p "$RUNNER_TEMP/connect-$kind-${GITHUB_SHA}"; done
          cp -a connect/web/dist "$RUNNER_TEMP/connect-browser-${GITHUB_SHA}/dist"
          cp -a connect/service/dist "$RUNNER_TEMP/connect-worker-${GITHUB_SHA}/dist"
          for kind in browser worker; do
            node --experimental-strip-types connect/delivery/artifacts.ts seal "$RUNNER_TEMP/connect-$kind-${GITHUB_SHA}" "connect-$kind"
            node --experimental-strip-types connect/delivery/artifacts.ts validate "$RUNNER_TEMP/connect-$kind-${GITHUB_SHA}" "connect-$kind"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: connect-browser-${{ github.sha }}
          path: ${{ runner.temp }}/connect-browser-${{ github.sha }}/
          if-no-files-found: error
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: connect-worker-${{ github.sha }}
          path: ${{ runner.temp }}/connect-worker-${{ github.sha }}/
          if-no-files-found: error
          include-hidden-files: true
  publish:
    if: inputs.producer-run != '' && github.repository == 'tryapparent/apparent' && vars.HOSTED_CD_ENABLED == 'true'
    concurrency:
      group: web-delivery-production-eligible
      cancel-in-progress: false
    environment:
      name: hosted-production
      url: https://hosted.tryapparent.com
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      HOSTED_WORKER_NAME: ${{ vars.HOSTED_WORKER_NAME }}
      HOSTED_D1_NAME: ${{ vars.HOSTED_D1_NAME }}
      HOSTED_D1_ID: ${{ vars.HOSTED_D1_ID }}
      HOSTED_R2_BUCKET: ${{ vars.HOSTED_R2_BUCKET }}
      POSTHOG_ENABLED: ${{ vars.POSTHOG_ENABLED || 'true' }}
      SHARING_ENABLED: ${{ vars.SHARING_ENABLED || 'true' }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - run: echo '10 minute whole-workflow execution budget; agent whose run hits the limit owns optimization and a successful rerun. Do not raise or bypass the limit.'
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Require atomic retirement of legacy hosted publisher
        run: |
          if rg '^  hosted:' .github/workflows/web-delivery.yml; then
            echo 'Legacy hosted publisher remains; Public integration must retire it atomically.' >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: npm ci --include=dev
        working-directory: connect/service
      - name: Admit and publish verified Worker without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PRODUCER_RUN: ${{ inputs.producer-run }}
        run: node --experimental-strip-types connect/delivery/publish.ts "$PRODUCER_RUN" "$RUNNER_TEMP/worker-payload"
  runtime-budget:
    name: Workflow runtime budget
    if: always()
    needs: [select, produce, publish, recipient, recipient-release]
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/runtime-budget
        with:
          platform: web

  recipient:
    if: github.repository == 'tryapparent/apparent' && github.ref == 'refs/heads/main' && inputs.producer-run == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu}
          - {runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu}
          - {runner: macos-15, target: aarch64-apple-darwin}
          - {runner: macos-15-intel, target: x86_64-apple-darwin}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Runtime budget ownership
        run: echo '10 minute execution budget; agent whose run hits the limit owns optimization and a successful rerun. Do not raise or bypass the limit.'
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - name: Test executable sealing
        run: node --experimental-strip-types --test connect/delivery/recipient/seal.test.ts
      - name: Isolate component from root build configuration
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/recipient-source" "$RUNNER_TEMP/recipient-output"
          cp -R connect/client/. "$RUNNER_TEMP/recipient-source/"
      - name: Test and build component only
        working-directory: ${{ runner.temp }}/recipient-source
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: '15.0'
        run: |
          cargo test --locked --target '${{ matrix.target }}' -j 3
          cargo build --locked --release --bin apparent-connect-recipient --target '${{ matrix.target }}' -j 3
          cp 'target/${{ matrix.target }}/release/apparent-connect-recipient' "$RUNNER_TEMP/recipient-output/"
      - name: Seal executable bytes
        env:
          TARGET: ${{ matrix.target }}
        run: node --experimental-strip-types connect/delivery/recipient/seal.ts "$RUNNER_TEMP/recipient-output" "$TARGET" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/recipient-output/*
      - uses: actions/upload-artifact@v4
        with:
          name: recipient-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
          path: ${{ runner.temp }}/recipient-output/*
          if-no-files-found: error
          retention-days: 90

  recipient-release:
    needs: recipient
    if: github.repository == 'tryapparent/apparent' && github.ref == 'refs/heads/main' && inputs.producer-run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      attestations: read
    steps:
      - name: Runtime budget ownership
        run: echo '10 minute execution budget; agent whose run hits the limit owns optimization and a successful rerun. Do not raise or bypass the limit.'
      - uses: actions/download-artifact@v4
        with:
          pattern: recipient-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: recipient-assets
      - name: Verify provenance and publish durable component version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="recipient-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir release-assets
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin x86_64-apple-darwin; do
            directory="recipient-assets/$version-$target"
            gh attestation verify "$directory/apparent-connect-recipient" --repo tryapparent/apparent --signer-workflow tryapparent/apparent/.github/workflows/connect-delivery.yml --source-ref refs/heads/main --source-digest "$GITHUB_SHA"
            gh attestation verify "$directory/manifest.json" --repo tryapparent/apparent --signer-workflow tryapparent/apparent/.github/workflows/connect-delivery.yml --source-ref refs/heads/main --source-digest "$GITHUB_SHA"
            chmod 755 "$directory/apparent-connect-recipient"
            tar -czf "release-assets/$version-$target.tar.gz" -C "$directory" apparent-connect-recipient manifest.json
          done
          cd release-assets
          sha256sum *.tar.gz > SHA256SUMS
          gh release create "$version" ./* --repo tryapparent/apparent --target "$GITHUB_SHA" --title "$version" --notes "Standalone recipient protocol 1. Source $GITHUB_SHA; trusted main producer run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT. Component binaries are not Apple signed or notarized. Desktop publication gates still apply." --latest=false
