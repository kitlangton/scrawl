name: Connect producer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  produce:
    if: github.repository == 'tryapparent/apparent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NODE_ENV: production
      VITE_HOSTED_API_ORIGIN: https://hosted.tryapparent.com
      PUBLIC_POSTHOG_ENABLED: ${{ vars.PUBLIC_POSTHOG_ENABLED || 'true' }}
      PUBLIC_POSTHOG_TOKEN: ${{ vars.PUBLIC_POSTHOG_TOKEN }}
      PUBLIC_POSTHOG_HOST: https://eu.i.posthog.com
      PUBLIC_POSTHOG_ENVIRONMENT: production
    steps:
      - name: Set runner evidence paths
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "CONNECT_EVIDENCE=$RUNNER_TEMP/connect-browser-evidence" >> "$GITHUB_ENV"
      - name: Verification runtime budget and ownership
        run: echo '10 minute whole-workflow execution budget; agent whose run hits the limit owns optimization and a successful rerun. Do not raise or bypass the limit.'
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Locked dependencies and browsers
        env:
          NODE_ENV: development
        run: |
          (cd connect/service && npm ci --include=dev)
          (cd connect/web && bun install --frozen-lockfile)
          (cd connect/web && ./node_modules/.bin/playwright-core install --with-deps chromium firefox)
          cd connect/web
          echo "CHROME_PATH=$(node --input-type=module -e 'import {chromium} from "playwright-core"; console.log(chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Verify producer contracts
        run: node --experimental-strip-types --test connect/delivery/*.test.ts
      - name: Verify service
        run: cd connect/service && npm test
      - name: Verify browser and analytics
        run: |
          node --experimental-strip-types --test shared/analytics/config.test.ts
          cd connect/web && npm test
      - name: Seal verified production outputs
        run: |
          for kind in browser worker; do mkdir -p "$RUNNER_TEMP/connect-$kind-${GITHUB_SHA}"; done
          cp -a connect/web/dist "$RUNNER_TEMP/connect-browser-${GITHUB_SHA}/dist"
          cp -a connect/service/dist "$RUNNER_TEMP/connect-worker-${GITHUB_SHA}/dist"
          for kind in browser worker; do
            node --experimental-strip-types connect/delivery/artifacts.ts seal "$RUNNER_TEMP/connect-$kind-${GITHUB_SHA}" "connect-$kind"
            node --experimental-strip-types connect/delivery/artifacts.ts validate "$RUNNER_TEMP/connect-$kind-${GITHUB_SHA}" "connect-$kind"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: connect-browser-${{ github.sha }}
          path: ${{ runner.temp }}/connect-browser-${{ github.sha }}/
          if-no-files-found: error
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: connect-worker-${{ github.sha }}
          path: ${{ runner.temp }}/connect-worker-${{ github.sha }}/
          if-no-files-found: error
          include-hidden-files: true
  runtime-budget:
    name: Workflow runtime budget
    if: always()
    needs: produce
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/runtime-budget
        with:
          platform: web
