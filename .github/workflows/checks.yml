name: Repository checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  workflow_run:
    workflows: [Linux verification, Mac verification, Public — checks & deploy]
    types: [requested, in_progress, completed]
  workflow_dispatch:
    inputs:
      pull_request:
        description: 'Optional PR number for one bounded reporter recovery; blank reconciles all PRs'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ (github.event_name == 'pull_request' || github.event_name == 'push') && (github.event.pull_request.number || github.ref) || format('reporter-event-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  hermes:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    name: Hermes inspection (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install plugin image dependency
        run: python -m pip install 'Pillow>=10.2,<13'
      - name: Verify recording inspection and evidence boundaries
        run: python -m unittest discover -s hermes/tests -v
  contracts:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - name: Verify early native prerequisite contracts
        run: node --experimental-strip-types --test enablement/prerequisites/*.test.ts
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: bun test enablement/verification-status/*.test.ts
      - name: Verify theme, push guards, selection and publication admission
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 enablement/verification.py --base "$BASE_SHA" --pr
      - name: Validate workflow syntax and job dependencies
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -shellcheck= -pyflakes= .github/workflows/checks.yml .github/workflows/linux-updater-harness.yml .github/workflows/verification.yml .github/workflows/verification-mac.yml .github/workflows/verification-platform.yml .github/workflows/release-linux.yml .github/workflows/release-mac-preview.yml .github/workflows/web-delivery.yml .github/workflows/stream-public.yml

  verification-status:
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'pull_request_target' || github.event.pull_request.base.ref == 'main') &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.event == 'workflow_dispatch' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.action != 'in_progress' || github.event.workflow_run.run_attempt > 1)))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: authoritative-verification-status-${{ github.event_name == 'workflow_dispatch' && inputs.pull_request && format('recovery-pr-{0}', inputs.pull_request) || (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'global-main' || format('candidate-{0}:{1}', github.event.pull_request.head.repo.full_name || github.event.workflow_run.head_repository.full_name, github.event.pull_request.head.ref || github.event.workflow_run.head_branch) }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      actions: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Reconcile affected PRs using trusted default-branch policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun enablement/verification-status/reporter.ts
