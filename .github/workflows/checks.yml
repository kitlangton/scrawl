name: Continuous delivery

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read

# Main uses commit groups so docs cannot replace pending code verification.
# PR updates supersede active checks.
concurrency:
  group: repository-checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # PR checkout is GitHub's proposed merge, so these checks cover integration.
  # Draft updates retain cheap feedback without allocating full platform suites.
  linux:
    needs: [contracts, hermes, select]
    if: >-
      !cancelled() && needs.contracts.result == 'success' && needs.hermes.result == 'success' &&
      (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false))
      && (needs.select.result != 'success' || needs.select.outputs.platform != 'false')
    uses: ./.github/workflows/verification-platform.yml
    with:
      runner: ubuntu-24.04
      release_receipt: false

  macos:
    # Share the cheap admission barrier; neither full platform waits for the other.
    needs: [contracts, hermes, select]
    if: >-
      !cancelled() && needs.contracts.result == 'success' && needs.hermes.result == 'success' &&
      (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false &&
      (needs.select.result != 'success' || needs.select.outputs.macos != 'false')))
      && (needs.select.result != 'success' || needs.select.outputs.platform != 'false')
    uses: ./.github/workflows/verification-platform.yml
    with:
      runner: macos-15-intel
      release_receipt: false

  select:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      macos: ${{ steps.paths.outputs.macos }}
      public: ${{ steps.paths.outputs.public }}
      updater: ${{ steps.paths.outputs.updater }}
      platform: ${{ steps.paths.outputs.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun enablement/ci/select.ts

  public:
    needs: select
    if: needs.select.outputs.public == 'true'
    uses: ./.github/workflows/stream-public.yml
    secrets:
      APPARENT_POSTHOG_TOKEN: ${{ secrets.APPARENT_POSTHOG_TOKEN }}

  updater:
    needs: select
    if: github.event_name == 'push' && needs.select.outputs.updater == 'true'
    uses: ./.github/workflows/linux-updater-harness.yml

  hermes:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    name: Hermes inspection (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install plugin image dependency
        run: python -m pip install 'Pillow>=10.2,<13'
      - name: Verify recording inspection and evidence boundaries
        run: python -m unittest discover -s hermes/tests -v

  hermes-macos:
    needs: [contracts, hermes, select]
    if: >-
      !cancelled() && needs.contracts.result == 'success' && needs.hermes.result == 'success' &&
      (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false))
      && (needs.select.result != 'success' || needs.select.outputs.platform != 'false')
    name: Hermes inspection (macos-15-intel)
    runs-on: macos-15-intel
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install plugin image dependency
        run: python -m pip install 'Pillow>=10.2,<13'
      - name: Verify recording inspection and evidence boundaries
        run: python -m unittest discover -s hermes/tests -v
  contracts:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - name: Verify early native prerequisite contracts
        run: |
          node --experimental-strip-types --test enablement/prerequisites/*.test.ts
          node --experimental-strip-types --test enablement/timing/mac-cache.test.ts
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: bun test enablement/ci/select.test.ts
      - name: Verify theme, push guards, selection and publication admission
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 enablement/verification.py --base "$BASE_SHA" --pr
      - name: Validate workflow syntax and job dependencies
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -shellcheck= -pyflakes= .github/workflows/checks.yml .github/workflows/linux-updater-harness.yml .github/workflows/verification.yml .github/workflows/verification-mac.yml .github/workflows/verification-platform.yml .github/workflows/release-linux.yml .github/workflows/release-mac-preview.yml .github/workflows/web-delivery.yml .github/workflows/stream-public.yml
