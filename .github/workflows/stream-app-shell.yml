name: app-shell delivery
on:
  push:
    branches: [main]
    paths:
      - 'composition/app/**'
      - 'shared/contracts/**'
      - 'shared/ui/**'
      - '.github/workflows/stream-app-shell.yml'
      - 'composition/delivery/**'
      - 'composition/architecture/**'
      - '.github/workflows/value-stream-delivery.yml'
      - '.github/actions/runtime-budget/**'
      - 'enablement/verification/workflow-budget.ts'
      - 'LICENSE'
permissions:
  contents: read
jobs:
  deliver:
    if: github.repository == 'tryapparent/apparent' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/value-stream-delivery.yml
    with:
      owner_id: 'app-shell'
      targets: '{"include":[{"id":"app-shell","target":"linux-x64","runner":"ubuntu-24.04","kind":"app-shell","stage":"development-app","package":"composition/app","verify":["check"],"build":"build","language":"typescript","packageManager":"npm","architecture_owner":"composition"},{"id":"app-shell","target":"macos-x64","runner":"macos-26-intel","kind":"app-shell","stage":"development-app","package":"composition/app","verify":["check"],"build":"build","language":"typescript","packageManager":"npm","architecture_owner":"composition"}]}'
      workflow_path: '.github/workflows/stream-app-shell.yml'
