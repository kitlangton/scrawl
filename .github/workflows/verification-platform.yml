name: Platform verification

on:
  workflow_call:
    inputs:
      revision:
        description: Exact Linux-verified main candidate for the Mac follower
        type: string
        default: ''
      runner:
        required: true
        type: string

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      root: ${{ steps.plan.outputs.root }}
      engine: ${{ steps.plan.outputs.engine }}
      browser: ${{ steps.plan.outputs.browser }}
    steps:
      - name: Verification runtime budget and ownership
        working-directory: ${{ runner.temp }}
        shell: bash
        run: echo '10 minute whole-workflow execution budget (runner queue excluded; parallel jobs count once). Per-job timeout is an additional safeguard. If exceeded, optimize the tests. The agent whose run hits the limit owns optimization and a successful rerun; do not raise or bypass the limit.'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verification receipt contracts
        run: node --test enablement/verification/*.test.ts
      - name: Recipient CLI installation contracts
        run: node --experimental-strip-types --test capture/agent/scripts/tests/install-cli.test.ts
      - name: Selector and hook contracts (no native proof)
        run: |
          python3 -m unittest discover -s enablement/tests -p 'test_pre_push_guard.py'
          python3 -m unittest discover -s enablement/tests -p 'test_commit_push_checkpoint.py'
          python3 -m unittest discover -s enablement/tests -p 'test_verification.py'
          python3 -m unittest discover -s enablement/tests -p 'test_temp_preflight.py'
          python3 -m unittest discover -s enablement/tests -p 'test_owner_lanes.py'
          python3 -m unittest discover -s capture/desktop/scripts/tests/mac -p 'test_*.py'
          python3 -m unittest discover -s capture/desktop/scripts/packaging -p 'test*.py'
      - name: Validate workflow syntax and job dependencies
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -shellcheck= -pyflakes= .github/workflows/verification.yml .github/workflows/verification-mac.yml .github/workflows/verification-platform.yml .github/workflows/release-linux.yml .github/workflows/release-mac-preview.yml .github/workflows/web-delivery.yml
      - name: Release admission contracts
        run: python3 -m unittest discover -s enablement/tests -p 'test_release_gate.py'
      - name: Advisory owner dependency report (does not select execution)
        run: |
          python3 enablement/owner_lanes.py --base HEAD^ --json "$RUNNER_TEMP/owner-plan.json" --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: owner-plan-${{ inputs.runner }}
          path: ${{ runner.temp }}/owner-plan.json
          if-no-files-found: error
      - id: plan
        run: |
          # Full tree: a cancelled earlier main run must not hide its delta.
          BASE=$(git hash-object -t tree /dev/null)
          python3 enablement/verification.py --base "${BASE:-unknown}" --github-output "$GITHUB_OUTPUT"

  desktop-ui:
    needs: select
    # Each caller verifies one platform independently.
    if: github.ref == 'refs/heads/main'
    name: desktop-ui (${{ inputs.runner }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: capture/desktop/ui/frontend
    steps:
      - name: Verification runtime budget and ownership
        working-directory: ${{ runner.temp }}
        shell: bash
        run: echo '10 minute whole-workflow execution budget (runner queue excluded; parallel jobs count once). Per-job timeout is an additional safeguard. If exceeded, optimize the tests. The agent whose run hits the limit owns optimization and a successful rerun; do not raise or bypass the limit.'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: capture/desktop/ui/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Prepare Electron before timed renderer tests
        run: node node_modules/electron/install.js
      - name: Linux Electron dependencies
        if: runner.os == 'Linux'
        run: npx --no-install playwright install-deps chromium
      - name: Renderer test receipt (not native acceptance)
        run: node ../../../../enablement/verification/receipt.ts --suite desktop-unit --output "$RUNNER_TEMP/verification-receipts" -- npm test
      - name: Electron bridge and renderer smoke (synthetic socket, not native acceptance)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            node ../../../../enablement/verification/receipt.ts --suite desktop-electron --output "$RUNNER_TEMP/verification-receipts" -- xvfb-run -a npm run test:electron
          else
            node ../../../../enablement/verification/receipt.ts --suite desktop-electron --output "$RUNNER_TEMP/verification-receipts" -- npm run test:electron
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-receipts-desktop-${{ inputs.runner }}
          path: ${{ runner.temp }}/verification-receipts/
          if-no-files-found: warn
          retention-days: 14

  connect-client:
    needs: select
    if: github.ref == 'refs/heads/main'
    name: connect-client (${{ inputs.runner }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    steps:
      - name: Verification runtime budget and ownership
        working-directory: ${{ runner.temp }}
        shell: bash
        run: echo '10 minute whole-workflow execution budget (runner queue excluded; parallel jobs count once). Per-job timeout is an additional safeguard. If exceeded, optimize the tests. The agent whose run hits the limit owns optimization and a successful rerun; do not raise or bypass the limit.'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: connect-client
          workspaces: connect/client -> ../../target/ci-connect-client
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Identify the bounded client verifier cache
        id: client-plan
        run: node enablement/verification/client-suite.ts --namespace >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/client-proof/
          key: ${{ steps.client-plan.outputs.namespace }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.client-plan.outputs.namespace }}-
      - name: Verify the independent Connect client package with gated reuse
        run: node enablement/verification/client-suite.ts --state "$RUNNER_TEMP/client-proof/proof.json"
      # Save failed audit tombstones too. Only automatic main runs can seed proof;
      # diagnostic dispatches cannot displace automatic candidate evidence.
      - uses: actions/cache/save@v4
        if: always() && steps.client-plan.outputs.namespace != '' && (github.event_name == 'push' || github.event_name == 'workflow_run')
        with:
          path: ${{ runner.temp }}/client-proof/
          key: ${{ steps.client-plan.outputs.namespace }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.client-plan.outputs.namespace != ''
        with:
          name: connect-client-proof-${{ inputs.runner }}
          path: ${{ runner.temp }}/client-proof/proof.json
          if-no-files-found: warn
          retention-days: 14

  connect-web:
    needs: select
    if: github.ref == 'refs/heads/main'
    name: connect-web (${{ inputs.runner }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    steps:
      - name: Verification runtime budget and ownership
        working-directory: ${{ runner.temp }}
        shell: bash
        run: echo '10 minute whole-workflow execution budget (runner queue excluded; parallel jobs count once). Per-job timeout is an additional safeguard. If exceeded, optimize the tests. The agent whose run hits the limit owns optimization and a successful rerun; do not raise or bypass the limit.'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Verify independent Connect browser package
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          TMPDIR: ${{ runner.temp }}
          CONNECT_EVIDENCE: ${{ runner.temp }}/connect-web-evidence
        run: |
          BASE=$(git hash-object -t tree /dev/null)
          python3 enablement/verification.py --base "$BASE" --run --online --suite browser --receipt-dir "$RUNNER_TEMP/verification-receipts"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-receipts-connect-web-${{ inputs.runner }}
          path: ${{ runner.temp }}/verification-receipts/
          if-no-files-found: warn
          retention-days: 14

  rust:
    needs: select
    if: github.ref == 'refs/heads/main'
    name: rust (${{ inputs.runner }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    steps:
      - name: Verification runtime budget and ownership
        working-directory: ${{ runner.temp }}
        shell: bash
        run: echo '10 minute whole-workflow execution budget (runner queue excluded; parallel jobs count once). Per-job timeout is an additional safeguard. If exceeded, optimize the tests. The agent whose run hits the limit owns optimization and a successful rerun; do not raise or bypass the limit.'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Linux application dependencies
        if: runner.os == 'Linux' && needs.select.outputs.root == 'true'
        run: ./capture/desktop/scripts/linux/appimage/dependencies.sh
      - name: Select the macOS 26 SDK required by native helpers
        if: runner.os == 'macOS' && needs.select.outputs.root == 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'
      - name: Pin the selected developer directory for Rust verification
        if: runner.os == 'macOS' && needs.select.outputs.root == 'true'
        shell: bash
        run: |
          selected_developer=$(xcode-select -p)
          case "$selected_developer" in
            /Applications/Xcode*.app/Contents/Developer) ;;
            *) echo 'Unexpected selected Xcode developer directory' >&2; exit 1 ;;
          esac
          test -d "$selected_developer"
          printf 'DEVELOPER_DIR=%s\n' "$selected_developer" >> "$GITHUB_ENV"
          printf 'Selected developer directory: %s\n' "$selected_developer"
      - name: Install CLI export speedup dependencies
        if: runner.os == 'macOS' && needs.select.outputs.root == 'true'
        run: command -v ffmpeg && command -v ffprobe || brew install ffmpeg
      - name: Install the Metal toolchain
        if: runner.os == 'macOS' && needs.select.outputs.root == 'true'
        run: xcrun --sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
      - uses: dtolnay/rust-toolchain@stable
        if: needs.select.outputs.root == 'true' || needs.select.outputs.engine == 'true'
        with:
          # Keep the trusted Mac cache producer on the focused consumers' tested
          # compiler. Retain the action's Cargo environment and Linux selection.
          toolchain: ${{ runner.os == 'macOS' && '1.99.1' || 'stable' }}
      - name: Verify the tested Mac compiler before cache restore
        if: runner.os == 'macOS' && (needs.select.outputs.root == 'true' || needs.select.outputs.engine == 'true')
        run: |
          test "$(rustc -V)" = 'rustc 1.99.1 (58cf8f9c3 2026-10-13)'
          rustc -vV
          cargo -V
      - name: Normalize the disposable Intel Mac compiler inventory
        if: runner.os == 'macOS' && (needs.select.outputs.root == 'true' || needs.select.outputs.engine == 'true')
        uses: ./.github/actions/mac-rust-cache
      - uses: Swatinem/rust-cache@v2
        if: needs.select.outputs.root == 'true' || needs.select.outputs.engine == 'true'
        with:
          # Cache versions include every path, not just the visible key. Keep
          # the pre-split inventory compatible with successful Mac caches and
          # native-proof-mac; client checks still run in their own required job.
          workspaces: |
            . -> target
            capture/engine -> target
            connect/client -> target
      - uses: actions/setup-node@v4
        if: needs.select.outputs.root == 'true'
        with:
          node-version: '22'
          cache: ${{ needs.select.outputs.root == 'true' && 'npm' || '' }}
          cache-dependency-path: capture/desktop/ui/frontend/package-lock.json
      - name: Execute Rust changed-tree checks (not GUI acceptance)
        run: |
          # Engine finalizer proofs reject group-writable cache ancestors.
          verification_tmp="$(mktemp -d "$HOME/.apparent-verification.XXXXXX")"
          readonly verification_tmp
          export TMPDIR="$verification_tmp"
          verification_complete=false
          cleanup() {
            local status=$?
            # Cancellation of the outer shell does not prove detached workers
            # stopped. Leave their private TMPDIR to hosted-runner teardown.
            if [ "$verification_complete" != true ]; then
              echo 'Verification did not complete; retaining its private temporary tree until runner teardown.' >&2
              if [ "$status" -eq 0 ]; then status=1; fi
              exit "$status"
            fi
            if ! rm -rf -- "$verification_tmp"; then
              echo '::error::Could not remove the owned verification temporary tree' >&2
              if [ "$status" -eq 0 ]; then status=1; fi
            fi
            exit "$status"
          }
          trap cleanup EXIT
          # Reproduce the CI-sensitive fixtures before the full affected suites.
          if [ "${{ needs.select.outputs.root }}" = true ]; then
            preflight_filters=(capture::desktop::settings::settings::tests::the_command_line_row_ capture::desktop::workflow::agent_capture::tests::competing_launches_cannot_remove_the_winning_control_socket)
            if [ "$RUNNER_OS" = macOS ]; then
              preflight_filters+=(connect::hosted::hosted_tests::hosted_security_darwin_acl_grants_fail_closed)
            fi
            cargo test -j 3 --locked --timings -- "${preflight_filters[@]}" --test-threads=1
          fi
          BASE=$(git hash-object -t tree /dev/null)
          cargo_trace_env=()
          if [ "$RUNNER_OS" = macOS ]; then
            cargo_trace_env=(env CARGO_LOG=cargo::compiler::fingerprint=trace)
          fi
          "${cargo_trace_env[@]}" python3 enablement/verification.py --base "$BASE" --run --online --suite rust --parallel-contracts --cargo-timings --receipt-dir "$RUNNER_TEMP/verification-receipts"
          verification_complete=true
      - name: Actual Electron to Rust Settings integration (not native GUI proof)
        if: needs.select.outputs.root == 'true'
        shell: bash
        run: |
          npm --prefix capture/desktop/ui/frontend ci --no-audit --no-fund
          # Electron 45 downloads lazily. Resolve it once before the test;
          # do not capture its download log as part of an executable pathname.
          node -e "require('./capture/desktop/ui/frontend/node_modules/electron')"
          if [ "$RUNNER_OS" = macOS ]; then
            electron="$PWD/capture/desktop/ui/frontend/node_modules/electron/dist/Electron.app/Contents/MacOS/Electron"
          else
            electron="$PWD/capture/desktop/ui/frontend/node_modules/electron/dist/electron"
          fi
          test -x "$electron"
          storage_tmp="$(mktemp -d "$HOME/.apparent-storage.XXXXXX")"
          readonly storage_tmp
          trap 'rm -rf -- "$storage_tmp"' EXIT
          TMPDIR="$storage_tmp" APPARENT_STORAGE_TEST_ELECTRON="$electron" \
            APPARENT_CONNECT_TEST_ELECTRON="$electron" \
            cargo test -j 3 --locked _electron_rust_roundtrip -- --ignored --nocapture
      - name: Install the Mac candidate (packaging, not launch acceptance)
        if: runner.os == 'macOS' && needs.select.outputs.root == 'true'
        shell: bash
        run: |
          export APPARENT_APP_DIR="$HOME/Applications/Apparent-Storage-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.app"
          test ! -e "$APPARENT_APP_DIR"
          APPARENT_NO_LAUNCH=1 bash capture/desktop/scripts/packaging/install-app.sh
          codesign --verify --deep --strict "$APPARENT_APP_DIR"
      - name: Packaged Mac Settings smoke (not capture or permission acceptance)
        if: runner.os == 'macOS' && needs.select.outputs.root == 'true'
        timeout-minutes: 3
        shell: bash
        env:
          APPARENT_PACKAGED_SMOKE: '1'
          APPARENT_SMOKE_OUTPUT: ${{ runner.temp }}/apparent-packaged-smoke
        run: |
          export APPARENT_APP_DIR="$HOME/Applications/Apparent-Storage-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.app"
          node capture/desktop/scripts/mac/packaged-smoke.cjs
      - name: Retain packaged Mac smoke evidence, including failures
        if: always() && runner.os == 'macOS' && needs.select.outputs.root == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mac-packaged-smoke
          path: ${{ runner.temp }}/apparent-packaged-smoke/
          if-no-files-found: warn
      - name: Native Mac Storage and error-reporting controls against the installed Rust GUI
        id: native-storage
        if: runner.os == 'macOS' && needs.select.outputs.root == 'true'
        timeout-minutes: 10
        shell: bash
        env:
          APPARENT_STORAGE_NATIVE_CI: '1'
          APPARENT_STORAGE_NATIVE_OUTPUT: ${{ runner.temp }}/apparent-storage-native
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          export APPARENT_APP_DIR="$HOME/Applications/Apparent-Storage-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.app"
          npm --prefix capture/desktop/ui/frontend run build
          APPARENT_STORAGE_NATIVE_APP_DIR="$APPARENT_APP_DIR" \
            node --test capture/desktop/ui/frontend/tests/mac-storage-native.cjs
      - name: Native GPUI Copy capture ID against the same installed App
        id: native-copy-id
        if: runner.os == 'macOS' && needs.select.outputs.root == 'true'
        timeout-minutes: 4
        shell: bash
        env:
          APPARENT_COPY_ID_NATIVE_CI: '1'
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          app="$HOME/Applications/Apparent-Storage-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.app"
          evidence="$RUNNER_TEMP/apparent-copy-id-native"
          test ! -e "$evidence"
          # Keep compiler diagnostics even when native compilation fails. The
          # fixture itself creates its fresh private evidence subdirectory.
          mkdir -m 700 "$evidence"
          swiftc capture/desktop/scripts/native/copy-capture-id.swift \
            -o "$evidence/copy-capture-id" > "$evidence/compile.log" 2>&1
          "$evidence/copy-capture-id" "$app" "$evidence/run"
      - name: Native Electron selected-reference control against the installed Rust App
        id: native-reference
        if: runner.os == 'macOS' && needs.select.outputs.root == 'true'
        timeout-minutes: 4
        shell: bash
        env:
          APPARENT_REFERENCE_OUTPUT: ${{ runner.temp }}/apparent-reference-electron
        run: |
          export APPARENT_REFERENCE_BINARY="$HOME/Applications/Apparent-Storage-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.app/Contents/MacOS/apparent"
          node --test capture/desktop/ui/frontend/tests/reference-native.cjs
      - name: Installed Mac Connect worker restart and encrypted fetch
        if: runner.os == 'macOS' && needs.select.outputs.root == 'true'
        timeout-minutes: 4
        env:
          APPARENT_CONNECT_NATIVE_CI: '1'
        run: |
          (cd connect/service && npm ci --no-audit --no-fund && npm run build)
          app="$HOME/Applications/Apparent-Storage-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.app"
          node connect/service/test/native/desktop-worker.mjs "$GITHUB_WORKSPACE" \
            "$app/Contents/MacOS/apparent" "$RUNNER_TEMP/apparent-connect-native"
      - name: Retain synthetic Connect worker evidence without credentials
        if: always() && runner.os == 'macOS' && needs.select.outputs.root == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mac-connect-worker-native
          path: ${{ runner.temp }}/apparent-connect-native/evidence/
          if-no-files-found: error
          retention-days: 7
      - name: Retain synthetic Electron reference evidence, including failures
        if: always() && runner.os == 'macOS' && needs.select.outputs.root == 'true' && steps.native-reference.outcome != 'skipped' && steps.native-reference.outcome != ''
        uses: actions/upload-artifact@v4
        with:
          name: mac-reference-electron-native
          path: |
            ${{ runner.temp }}/apparent-reference-electron/*.json
            ${{ runner.temp }}/apparent-reference-electron/*.png
            ${{ runner.temp }}/apparent-reference-electron/*.log
          if-no-files-found: error
          retention-days: 7
      - name: Retain synthetic native Copy capture ID evidence, including failures
        if: always() && runner.os == 'macOS' && needs.select.outputs.root == 'true' && steps.native-copy-id.outcome != 'skipped' && steps.native-copy-id.outcome != ''
        uses: actions/upload-artifact@v4
        with:
          name: mac-copy-capture-id-native
          path: |
            ${{ runner.temp }}/apparent-copy-id-native/**/*.json
            ${{ runner.temp }}/apparent-copy-id-native/**/*.png
            ${{ runner.temp }}/apparent-copy-id-native/**/*.log
            ${{ runner.temp }}/apparent-copy-id-native/compile.log
          if-no-files-found: error
          retention-days: 7
      - name: Retain synthetic Mac Storage evidence, including failures
        if: always() && runner.os == 'macOS' && needs.select.outputs.root == 'true' && steps.native-storage.outcome != 'skipped' && steps.native-storage.outcome != ''
        uses: actions/upload-artifact@v4
        with:
          name: mac-storage-native
          path: |
            ${{ runner.temp }}/apparent-storage-native/*.json
            ${{ runner.temp }}/apparent-storage-native/*.png
            ${{ runner.temp }}/apparent-storage-native/*.log
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-receipts-rust-${{ inputs.runner }}
          path: ${{ runner.temp }}/verification-receipts/
          if-no-files-found: warn
          retention-days: 14

      - name: Retain Cargo unit timings, including incomplete verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-${{ inputs.runner }}
          path: |
            target/cargo-timings/*.html
            capture/engine/target/cargo-timings/*.html
          if-no-files-found: warn
          retention-days: 7

      - name: Retain verified Intel Mac development executables
        if: success() && runner.os == 'macOS' && runner.arch == 'X64' && needs.select.outputs.root == 'true'
        run: node enablement/verification/mac-artifact.ts "$RUNNER_TEMP/mac-dev-executables"
      - name: Upload Intel Mac development executable contract
        if: success() && runner.os == 'macOS' && runner.arch == 'X64' && needs.select.outputs.root == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mac-dev-executables-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mac-dev-executables/
          if-no-files-found: error
          retention-days: 7

  release-ready:
    name: ${{ inputs.revision && format('Release verification ({0})', inputs.revision) || 'Release verification' }}
    needs: [select, desktop-ui, connect-client, connect-web, rust]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verification runtime budget and ownership
        working-directory: ${{ runner.temp }}
        shell: bash
        run: echo '10 minute whole-workflow execution budget (runner queue excluded; parallel jobs count once). Per-job timeout is an additional safeguard. If exceeded, optimize the tests. The agent whose run hits the limit owns optimization and a successful rerun; do not raise or bypass the limit.'
      - run: echo "Platform checks passed for $CANDIDATE_SHA"
        env:
          CANDIDATE_SHA: ${{ inputs.revision || github.sha }}
