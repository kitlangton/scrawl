name: public delivery
on:
  pull_request:
    branches: [main]
    paths:
      - 'public/**'
      - 'shared/ui/**'
      - 'shared/analytics/**'
      - 'shared/assets/**'
      - 'README.md'
      - 'capture/agent/skills/apparent/SKILL.md'
      - '.npmrc'
      - 'bunfig.toml'
      - '.bunfig.toml'
      - '.github/workflows/stream-public.yml'
      - 'composition/delivery/**'
      - 'composition/architecture/**'
      - '.github/actions/delivery-contracts/**'
      - '.github/actions/delivery-component/**'
      - '.github/actions/runtime-budget/**'
      - 'enablement/verification/workflow-budget.ts'
      - 'enablement/verification/web/**'
      - 'LICENSE'
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'shared/ui/**'
      - 'shared/analytics/**'
      - 'shared/assets/**'
      - 'README.md'
      - 'capture/agent/skills/apparent/SKILL.md'
      - '.npmrc'
      - 'bunfig.toml'
      - '.bunfig.toml'
      - '.github/workflows/stream-public.yml'
      - 'composition/delivery/**'
      - 'composition/architecture/**'
      - '.github/actions/delivery-contracts/**'
      - '.github/actions/delivery-component/**'
      - '.github/actions/runtime-budget/**'
      - 'enablement/verification/workflow-budget.ts'
      - 'enablement/verification/web/**'
      - 'LICENSE'
permissions:
  contents: read
env:
  APPARENT_DELIVERY_WORKFLOW_PATH: '.github/workflows/stream-public.yml'
concurrency:
  group: value-stream-public-${{ github.ref == 'refs/heads/main' && 'main' || github.run_id }}
  cancel-in-progress: false
jobs:
  contracts:
    # The agent whose run hits the limit owns optimization; never raise it.
    name: deliver / Delivery contracts
    if: github.repository == 'tryapparent/apparent' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository))
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/delivery-contracts

  stream:
    # The agent whose run hits the limit owns optimization; never raise it.
    name: deliver / stream (${{ matrix.id }}, ${{ matrix.target }})
    needs: contracts
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: {"include":[{"id":"public","target":"web","runner":"ubuntu-24.04","kind":"directory","stage":"website","package":"public/site","verify":[],"build":"verify:installed","language":"typescript","packageManager":"bun","architecture_owner":""}]}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.target == 'web' && 10 || 15 }}
    outputs:
      artifact-name: stream-public-web-${{ steps.component.outputs.input-digest }}
      input-digest: ${{ steps.component.outputs.input-digest }}
    env:
      OWNER_ID: ${{ matrix.id }}
      OWNER_TARGET: ${{ matrix.target }}
      PUBLIC_POSTHOG_ENABLED: ${{ vars.PUBLIC_POSTHOG_ENABLED || 'true' }}
      PUBLIC_POSTHOG_TOKEN: ${{ vars.PUBLIC_POSTHOG_TOKEN }}
      PUBLIC_POSTHOG_HOST: https://eu.i.posthog.com
      PUBLIC_POSTHOG_ENVIRONMENT: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Validate the exact Public candidate
        run: node --experimental-strip-types enablement/verification/web/candidate.ts
      - uses: ./.github/actions/delivery-component
        id: component
        with:
          id: ${{ matrix.id }}
          target: ${{ matrix.target }}
          kind: ${{ matrix.kind }}
          language: ${{ matrix.language }}
          packageManager: ${{ matrix.packageManager }}
          architecture_owner: ${{ matrix.architecture_owner }}
          publish: 'true'

  verify-pr:
    # The agent whose run hits the limit owns optimization; never raise it.
    name: verify-pr / pr-stream (${{ matrix.id }}, ${{ matrix.target }})
    needs: contracts
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix: {"include":[{"id":"public","target":"web","runner":"ubuntu-24.04","kind":"directory","stage":"website","package":"public/site","verify":[],"build":"verify:installed","language":"typescript","packageManager":"bun","architecture_owner":""}]}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.target == 'web' && 10 || 15 }}
    env:
      OWNER_ID: ${{ matrix.id }}
      OWNER_TARGET: ${{ matrix.target }}
      PUBLIC_POSTHOG_ENABLED: 'true'
      PUBLIC_POSTHOG_TOKEN: phc_synthetic
      PUBLIC_POSTHOG_HOST: https://eu.i.posthog.com
      PUBLIC_POSTHOG_ENVIRONMENT: synthetic
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/delivery-component
        id: component
        with:
          id: ${{ matrix.id }}
          target: ${{ matrix.target }}
          kind: ${{ matrix.kind }}
          language: ${{ matrix.language }}
          packageManager: ${{ matrix.packageManager }}
          architecture_owner: ${{ matrix.architecture_owner }}
          publish: 'false'

  deploy:
    permissions:
      contents: read
      actions: read
    name: deploy (public, web)
    needs: stream
    if: github.repository == 'tryapparent/apparent' && github.ref == 'refs/heads/main' && vars.WEBSITE_CD_ENABLED == 'true'
    concurrency:
      group: website-production-eligible
      cancel-in-progress: false
    environment:
      name: website-production
      url: https://app.tryapparent.com
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PUBLIC_POSTHOG_ENABLED: ${{ vars.PUBLIC_POSTHOG_ENABLED || 'true' }}
      PUBLIC_POSTHOG_TOKEN: ${{ vars.PUBLIC_POSTHOG_TOKEN }}
      PUBLIC_POSTHOG_HOST: https://eu.i.posthog.com
      PUBLIC_POSTHOG_ENVIRONMENT: production
    steps:
      - name: Verification runtime budget and ownership
        working-directory: ${{ runner.temp }}
        shell: bash
        run: echo '10 minute whole-workflow execution budget (runner queue excluded; parallel jobs count once). Per-job timeout is an additional safeguard. If exceeded, optimize the tests. The agent whose run hits the limit owns optimization and a successful rerun; do not raise or bypass the limit.'
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Test publication contracts
        run: |
          node --experimental-strip-types --test enablement/verification/web/*.test.ts
      - name: Install locked website dependencies and browser
        working-directory: public/site
        run: |
          bun install --frozen-lockfile
          node --experimental-strip-types scripts/browser-setup/install.ts
          echo "CHROME_PATH=$(node --input-type=module -e 'import {chromium} from "playwright-core"; console.log(chromium.executablePath())')" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.stream.outputs.artifact-name }}
          path: .build/public-component
      - name: Consume this run's verified Public component
        env:
          PUBLIC_COMPONENT_INPUT_DIGEST: ${{ needs.stream.outputs.input-digest }}
        run: node --experimental-strip-types public/site/scripts/cd/stream-artifact.ts --current .build/public-component .build/public-artifact
      - name: Stage the verified Public website
        working-directory: public/site
        run: |
          cp -a "$GITHUB_WORKSPACE/.build/public-artifact" dist-apparent
      - name: Prepare source-built Pages artifact
        working-directory: public/site
        run: |
          node --test scripts/artifact/public.test.ts scripts/pages/test-pages-package.ts scripts/pages/test-pages-video.ts
          node scripts/pages/prepare-pages.ts
          PUBLIC_ARTIFACT_INPUT="$GITHUB_WORKSPACE/.build/public-artifact" node scripts/artifact/verify.ts
          PUBLIC_THEME_ARTIFACT=public/site/dist-apparent THEME_SURFACES=public node ../../shared/ui/test/appearance.mjs
          node scripts/pages/prepare-pages-video.ts
          SITE_ARTIFACT=dist-apparent node --test scripts/pages/test-public-homepage.ts
          node scripts/cd/publish-pages.ts seal ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: website-${{ github.sha }}
          path: .build/website/
          if-no-files-found: error
          # The checked public demos use .local-media; do not drop their assets.
          include-hidden-files: true
          retention-days: 90
      - name: Publish checked main to Cloudflare Pages (never Clanker or the Worker)
        env:
          GH_TOKEN: ${{ github.token }}
          WEBSITE_PAGES_API_TOKEN: ${{ secrets.WEBSITE_PAGES_API_TOKEN }}
        run: GITHUB_SHA="${{ github.sha }}" node public/site/scripts/cd/publish-pages.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-deployment-receipt
          path: website-receipt.json
          if-no-files-found: ignore

  runtime-budget:
    name: deliver / Workflow runtime budget
    permissions:
      contents: read
      actions: read
    needs: [contracts, stream, verify-pr, deploy]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: ./.github/actions/runtime-budget
        with:
          platform: web
