name: Public — checks & deploy

on:
  workflow_call:
    secrets:
      APPARENT_POSTHOG_TOKEN:
        required: false
      WEBSITE_PAGES_API_TOKEN:
        required: false
  workflow_dispatch:

permissions:
  contents: read

# Main checks preserve active runs. PR checks may coalesce; publication has its own lock.
concurrency:
  group: public-${{ github.event_name == 'workflow_dispatch' && 'production' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Install Public's locked dependencies and browsers
        working-directory: public/site
        run: |
          bun install --frozen-lockfile
          ./node_modules/.bin/playwright-core install --with-deps chromium firefox
          echo "CHROME_PATH=$(node --input-type=module -e 'import {chromium} from "playwright-core"; console.log(chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Verify Public source, browsers, shared inputs and prepared movie worker
        working-directory: public/site
        env:
          PUBLIC_POSTHOG_TOKEN: ${{ secrets.APPARENT_POSTHOG_TOKEN }}
          PUBLIC_POSTHOG_HOST: https://eu.i.posthog.com
          PUBLIC_POSTHOG_ENVIRONMENT: production
        run: npm run verify
      - name: Seal the checked Public-only Pages artifact
        run: node public/site/scripts/cd/publish-pages.ts seal "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: public-${{ github.sha }}
          path: .build/website/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  deploy:
    needs: verify
    if: github.repository == 'tryapparent/apparent' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.WEBSITE_CD_ENABLED == 'true'
    environment:
      name: website-production
      url: https://app.tryapparent.com
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: public-${{ github.sha }}
          path: .build/website
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: bun install --frozen-lockfile
        working-directory: public/site
      - name: Publish sealed current main to Pages and read back both Public origins
        env:
          GH_TOKEN: ${{ github.token }}
          WEBSITE_PAGES_API_TOKEN: ${{ secrets.WEBSITE_PAGES_API_TOKEN }}
        run: node public/site/scripts/cd/publish-pages.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-deployment-receipt
          path: website-receipt.json
          if-no-files-found: ignore
