name: Mac verification

on:
  workflow_dispatch:
    inputs:
      connect_worker_proof:
        description: 'Run only installed Connect worker proof on a candidate branch'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# Every automatic Mac candidate already has a matching Linux receipt.
# Finish running Mac work; coalesce only pending Linux-verified candidates.
# Failed Linux completions and manual diagnostics cannot evict a good pending run.
concurrency:
  group: verification-macos-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'workflow_run' && (github.event.workflow_run.conclusion != 'success' || github.event.workflow_run.event != 'push' || github.event.workflow_run.head_repository.full_name != github.repository) && github.run_id || 'eligible' }}
  cancel-in-progress: false

jobs:
  admit:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - name: Verification runtime budget and ownership
        working-directory: ${{ runner.temp }}
        shell: bash
        run: echo '15 minute whole-workflow execution budget (runner queue excluded; parallel jobs count once). Per-job timeout is an additional safeguard. If exceeded, optimize the tests. The agent whose run hits the limit owns optimization and a successful rerun; do not raise or bypass the limit.'
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          VERIFY_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            python3 enablement/release_gate.py --platform linux --sha "$REQUEST_SHA" --run-id "$VERIFY_RUN_ID"
          else
            echo "sha=$REQUEST_SHA" >> "$GITHUB_OUTPUT"
          fi
  verify:
    needs: admit
    if: github.ref == 'refs/heads/main'
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/verification-platform.yml
    with:
      # General Mac CI can use Intel capacity; arm64 packaging stays on Apple Silicon.
      runner: macos-26-intel
      revision: ${{ needs.admit.outputs.sha }}

  connect-native:
    if: github.ref != 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.connect_worker_proof
    uses: ./.github/workflows/native-proof-mac.yml

  runtime-budget:
    # An ineligible follower has no workload; keep the entire run skipped.
    # Still audit failed/cancelled attempts whenever a workload was admitted.
    if: always() && (needs.admit.result != 'skipped' || needs.verify.result != 'skipped' || needs.connect-native.result != 'skipped')
    needs: [admit, verify, connect-native]
    permissions:
      contents: read
      actions: read
    name: Workflow runtime budget
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: ./.github/actions/runtime-budget
        with:
          platform: macos
