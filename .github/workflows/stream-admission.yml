name: value-stream admission
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows:
      - agent delivery
      - app-shell delivery
      - Connect client delivery
      - engine-media-native delivery
      - engine-native delivery
      - engine delivery
      - onboarding delivery
      - platform-config delivery
      - public delivery
      - record delivery
    types: [in_progress, completed]
# Serialize updates for the same candidate; different PR heads remain independent.
concurrency:
  group: admission-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
  cancel-in-progress: false
permissions:
  actions: read
  checks: write
  contents: read
  pull-requests: read
jobs:
  admission:
    if: github.repository == 'tryapparent/apparent'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # pull_request_target and workflow_run both execute this trusted default-branch file.
      # Never check out the pull request head in this write-capable workflow.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Publish exact-head admission receipt
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types composition/delivery/admission.ts
