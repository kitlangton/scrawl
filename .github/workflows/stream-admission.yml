name: value-stream admission
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows:
      - agent delivery
      - app-shell delivery
      - Connect browser delivery
      - Connect client delivery
      - engine-media-native delivery
      - engine-native delivery
      - engine delivery
      - onboarding delivery
      - platform-config delivery
      - public delivery
      - record delivery
    types: [in_progress, completed]
permissions:
  actions: read
  checks: write
  contents: read
  pull-requests: read
jobs:
  admission:
    # PR events seed the receipt; only rerun starts need to clear an earlier pass.
    # Filter before runner allocation, checkout and Node setup.
    if: >-
      github.repository == 'tryapparent/apparent' &&
      (github.event_name == 'pull_request_target' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.repository.full_name == github.repository &&
        (github.event.action == 'completed' ||
         (github.event.action == 'in_progress' && github.event.workflow_run.run_attempt > 1))))
    # Skipped events must not coalesce away a useful pending PR update.
    concurrency:
      group: admission-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # pull_request_target and workflow_run both execute this trusted default-branch file.
      # Never check out the pull request head in this write-capable workflow.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Publish exact-head admission receipt
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types composition/delivery/admission.ts
