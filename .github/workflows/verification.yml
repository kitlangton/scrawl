name: Changed-tree verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      root: ${{ steps.plan.outputs.root }}
      engine: ${{ steps.plan.outputs.engine }}
      browser: ${{ steps.plan.outputs.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Selector and hook contracts (no native proof)
        run: |
          python3 -m unittest discover -s enablement/tests -p 'test_pre_push_guard.py'
          python3 -m unittest discover -s enablement/tests -p 'test_verification.py'
      - id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 enablement/verification.py --base "${BASE:-unknown}" --github-output "$GITHUB_OUTPUT"

  desktop-ui:
    needs: select
    # Frontend/shared UI changes currently select the conservative root gate.
    if: needs.select.outputs.root == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: capture/desktop/ui/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: capture/desktop/ui/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Linux Electron dependencies
        if: runner.os == 'Linux'
        run: npx --no-install playwright install-deps chromium
      - run: npm test
      - name: Electron bridge and renderer smoke (synthetic socket, not native acceptance)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a npm run test:electron
          else
            npm run test:electron
          fi

  rust:
    needs: select
    if: needs.select.outputs.root == 'true' || needs.select.outputs.engine == 'true' || needs.select.outputs.browser == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Linux application dependencies
        if: runner.os == 'Linux' && needs.select.outputs.root == 'true'
        run: ./capture/desktop/scripts/linux/appimage/dependencies.sh
      - name: Select the macOS 26 SDK required by native helpers
        if: runner.os == 'macOS' && needs.select.outputs.root == 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'
      - name: Install the Metal toolchain
        if: runner.os == 'macOS' && needs.select.outputs.root == 'true'
        run: xcrun --sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
      - uses: dtolnay/rust-toolchain@stable
        if: needs.select.outputs.root == 'true' || needs.select.outputs.engine == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.select.outputs.root == 'true' || needs.select.outputs.engine == 'true'
        with:
          workspaces: |
            . -> target
            capture/engine -> target
            connect/client -> connect/client/target
      - uses: actions/setup-node@v4
        if: needs.select.outputs.browser == 'true'
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        if: needs.select.outputs.browser == 'true'
        with:
          bun-version: '1.3.10'
      - uses: browser-actions/setup-chrome@v1
        if: needs.select.outputs.browser == 'true'
        id: chrome
      - name: Verify the independent Connect client package
        if: needs.select.outputs.root == 'true'
        run: |
          cargo build --manifest-path connect/client/Cargo.toml --locked
          cargo test --manifest-path connect/client/Cargo.toml --locked -- --test-threads=2
      - name: Execute the same changed-tree checks (not GUI acceptance)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          # Engine finalizer proofs reject group-writable cache ancestors.
          verification_tmp="$(mktemp -d "$HOME/.apparent-verification.XXXXXX")"
          readonly verification_tmp
          export TMPDIR="$verification_tmp"
          cleanup() {
            local status=$?
            if ! rm -rf -- "$verification_tmp"; then
              echo '::error::Could not remove the owned verification temporary tree' >&2
              if [ "$status" -eq 0 ]; then status=1; fi
            fi
            exit "$status"
          }
          trap cleanup EXIT
          # Reproduce the CI-sensitive fixtures before the full affected suites.
          if [ "${{ needs.select.outputs.root }}" = true ]; then
            cargo test -j 3 --locked capture::desktop::settings::settings::tests::the_command_line_row_ -- --test-threads=2
            cargo test -j 3 --locked capture::desktop::workflow::agent_capture::tests::competing_launches_cannot_remove_the_winning_control_socket -- --exact
            if [ "$RUNNER_OS" = macOS ]; then
              cargo test -j 3 --locked connect::hosted::hosted_tests::hosted_security_darwin_acl_grants_fail_closed -- --exact
            fi
          fi
          python3 enablement/verification.py --base "${BASE:-unknown}" --run --online
