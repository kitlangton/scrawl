name: Linux verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Coalesce only this platform; a queued Mac must not hold Linux publication.
concurrency:
  group: changed-tree-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verification-platform.yml
    with:
      runner: ubuntu-24.04
