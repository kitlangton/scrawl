name: Linux verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Finish the running candidate; replace only pending work. Mac never holds this lane.
concurrency:
  group: changed-tree-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/verification-platform.yml
    with:
      runner: ubuntu-24.04

  runtime-budget:
    if: always()
    needs: [verify]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/runtime-budget.yml
