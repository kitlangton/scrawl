name: platform-config delivery
on:
  push:
    branches: [main]
    paths:
      - 'composition/config/**'
      - 'shared/config-native/**'
      - 'shared/contracts/**'
      - '.cargo/**'
      - '.github/workflows/streams/platform-config.yml'
      - 'composition/delivery/**'
      - 'composition/architecture/**'
      - '.github/workflows/value-stream-delivery.yml'
      - '.github/actions/runtime-budget/**'
      - 'enablement/verification/workflow-budget.ts'
      - 'LICENSE'
permissions:
  contents: read
jobs:
  deliver:
    if: github.repository == 'tryapparent/apparent' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/value-stream-delivery.yml
    with:
      owner_id: 'platform-config'
      targets: '{"include":[{"id":"platform-config","target":"linux-x64","runner":"ubuntu-24.04","kind":"directory","stage":"library","package":"composition/config/native","verify":["verify"],"build":"build","language":"native","packageManager":"npm","architecture_owner":"composition"},{"id":"platform-config","target":"macos-x64","runner":"macos-26-intel","kind":"directory","stage":"library","package":"composition/config/native","verify":["verify"],"build":"build","language":"native","packageManager":"npm","architecture_owner":"composition"}]}'
      workflow_path: '.github/workflows/streams/platform-config.yml'
