name: Linux updater harness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/linux-updater-harness.yml'
      - 'capture/desktop/scripts/linux/gui/**'
      - 'capture/desktop/scripts/linux/updater/**'
      - 'capture/desktop/scripts/linux/updater/updater-fixture.py'
      - 'capture/desktop/linux/update.rs'
      - 'capture/desktop/settings/settings.rs'
      - 'capture/desktop/settings/settings_window.rs'

permissions:
  contents: read

jobs:
  contracts:
    name: Harness contracts (not GUI proof)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install disk-image contract dependency (no KVM required)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-utils
      - name: Install OCR preprocessing dependency
        run: python3 -m pip install Pillow
      - name: Test OCR, release fixture and disposable-runner contracts
        run: |
          python3 capture/desktop/scripts/linux/updater/test-updater-gui.py
          python3 capture/desktop/scripts/linux/gui/test-gui-vm.py
          python3 capture/desktop/scripts/linux/gui/test-capture-smoke.py
      - name: Check driver syntax
        run: |
          python3 -m py_compile capture/desktop/scripts/linux/gui/gui-vm.py capture/desktop/scripts/linux/gui/gui-vm-reaper.py capture/desktop/scripts/linux/updater/updater-gui.py capture/desktop/scripts/linux/updater/updater-fixture.py capture/desktop/scripts/linux/gui/test-gui-vm.py
          python3 -m py_compile capture/desktop/scripts/linux/gui/capture-smoke.py capture/desktop/scripts/linux/gui/test-capture-smoke.py
          bash -n capture/desktop/scripts/linux/updater/updater-gui-scenario.sh
