name: platform delivery
on:
  pull_request:
    branches: [main]
    paths:
      - 'composition/config/**'
      - 'shared/config-native/**'
      - 'shared/contracts/**'
      - '.cargo/**'
      - 'composition/delivery/**'
      - 'composition/architecture/**'
      - '.github/actions/delivery-contracts/**'
      - '.github/actions/delivery-component/**'
      - '.github/actions/runtime-budget/**'
      - 'enablement/verification/workflow-budget.ts'
      - 'LICENSE'
      - 'shared/resources/**'
      - 'enablement/native/owned-processes.ts'
      - '.github/workflows/verification-platform.yml'
      - 'composition/app/**'
      - 'composition/native-host/**'
      - 'shared/ui/**'
      - '.github/workflows/stream-platform.yml'
  push:
    branches: [main]
    paths:
      - 'composition/config/**'
      - 'shared/config-native/**'
      - 'shared/contracts/**'
      - '.cargo/**'
      - 'composition/delivery/**'
      - 'composition/architecture/**'
      - '.github/actions/delivery-contracts/**'
      - '.github/actions/delivery-component/**'
      - '.github/actions/runtime-budget/**'
      - 'enablement/verification/workflow-budget.ts'
      - 'LICENSE'
      - 'shared/resources/**'
      - 'enablement/native/owned-processes.ts'
      - '.github/workflows/verification-platform.yml'
      - 'composition/app/**'
      - 'composition/native-host/**'
      - 'shared/ui/**'
      - '.github/workflows/stream-platform.yml'
permissions:
  contents: read
env:
  APPARENT_DELIVERY_WORKFLOW_PATH: '.github/workflows/stream-platform.yml'
jobs:
  contracts:
    # The agent whose run hits the limit owns optimization; never raise it.
    name: deliver / Delivery contracts
    if: github.repository == 'tryapparent/apparent'
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.selection.outputs.matrix }}
      has_ready: ${{ steps.selection.outputs.has_ready }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Select changed platform components
        id: selection
        run: node --experimental-strip-types composition/delivery/platform/plan.ts
      - uses: ./.github/actions/delivery-contracts

  stream:
    # The agent whose run hits the limit owns optimization; never raise it.
    name: deliver / stream (${{ matrix.id }}, ${{ matrix.target }})
    needs: contracts
    if: github.ref == 'refs/heads/main' && needs.contracts.outputs.has_ready == 'true'
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.contracts.outputs.matrix) }}
    # Only selected components share a lock: an unrelated push must not replace
    # another component's pending main producer.
    concurrency:
      group: platform-${{ matrix.id }}-${{ matrix.target }}-${{ github.ref == 'refs/heads/main' && 'main' || github.run_id }}
      cancel-in-progress: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.target == 'web' && 10 || 15 }}
    env:
      OWNER_ID: ${{ matrix.id }}
      OWNER_TARGET: ${{ matrix.target }}
      PUBLIC_POSTHOG_ENABLED: ${{ vars.PUBLIC_POSTHOG_ENABLED || 'true' }}
      PUBLIC_POSTHOG_TOKEN: ${{ vars.PUBLIC_POSTHOG_TOKEN }}
      PUBLIC_POSTHOG_HOST: https://eu.i.posthog.com
      PUBLIC_POSTHOG_ENVIRONMENT: production
      VITE_HOSTED_API_ORIGIN: https://hosted.tryapparent.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/delivery-component
        id: component
        with:
          id: ${{ matrix.id }}
          target: ${{ matrix.target }}
          kind: ${{ matrix.kind }}
          language: ${{ matrix.language }}
          packageManager: ${{ matrix.packageManager }}
          architecture_owner: ${{ matrix.architecture_owner }}
          publish: 'true'

  verify-pr:
    # The agent whose run hits the limit owns optimization; never raise it.
    name: verify-pr / pr-stream (${{ matrix.id }}, ${{ matrix.target }})
    needs: contracts
    if: github.event_name == 'pull_request' && needs.contracts.outputs.has_ready == 'true'
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.contracts.outputs.matrix) }}
    # Only selected components share a lock: an unrelated push must not replace
    # another component's pending main producer.
    concurrency:
      group: platform-${{ matrix.id }}-${{ matrix.target }}-${{ github.ref == 'refs/heads/main' && 'main' || github.run_id }}
      cancel-in-progress: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.target == 'web' && 10 || 15 }}
    env:
      OWNER_ID: ${{ matrix.id }}
      OWNER_TARGET: ${{ matrix.target }}
      PUBLIC_POSTHOG_ENABLED: 'true'
      PUBLIC_POSTHOG_TOKEN: phc_synthetic
      PUBLIC_POSTHOG_HOST: https://eu.i.posthog.com
      PUBLIC_POSTHOG_ENVIRONMENT: synthetic
      VITE_HOSTED_API_ORIGIN: https://hosted.tryapparent.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/delivery-component
        id: component
        with:
          id: ${{ matrix.id }}
          target: ${{ matrix.target }}
          kind: ${{ matrix.kind }}
          language: ${{ matrix.language }}
          packageManager: ${{ matrix.packageManager }}
          architecture_owner: ${{ matrix.architecture_owner }}
          publish: 'false'

  runtime-budget:
    name: deliver / Workflow runtime budget
    permissions:
      contents: read
      actions: read
    needs: [contracts, stream, verify-pr]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Require successful selected components
        env:
          CONTRACTS: ${{ needs.contracts.result }}
          HAS_READY: ${{ needs.contracts.outputs.has_ready }}
          PRODUCER: ${{ needs.stream.result }}
          PR: ${{ needs.verify-pr.result }}
          EVENT: ${{ github.event_name }}
        run: |
          test "$CONTRACTS" = success
          if [ "$HAS_READY" = true ]; then
            if [ "$EVENT" = pull_request ]; then test "$PR" = success; else test "$PRODUCER" = success; fi
          else
            test "$HAS_READY" = false
          fi
      - uses: ./.github/actions/runtime-budget
        with:
          platform: linux
