name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install the Metal toolchain
        run: xcrun --sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
      - run: cargo build --locked
      - run: cargo check --no-default-features --locked
      - name: No compromised eMudhra CA roots
        run: scripts/check-ca-roots.sh target/debug/scrawl
      - run: cargo test --locked

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo build --locked
      - name: No AVX-512 outside the CPU backends that need it
        run: scripts\check-windows-cpu-tiers.ps1 target\debug
      - run: cargo test --locked
      - uses: actions/upload-artifact@v5
        with:
          name: scrawl-windows-x86_64
          path: |
            target/debug/scrawl.exe
            target/debug/transcribe.dll
            target/debug/ggml*.dll
