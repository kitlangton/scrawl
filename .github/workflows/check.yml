name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install the Metal toolchain
        run: xcrun --sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
      - run: cargo build --locked
      - name: No compromised eMudhra CA roots
        run: scripts/check-ca-roots.sh target/debug/scrawl
      - run: cargo test --locked

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo build --locked
      - name: No AVX-512 outside the CPU backends that need it
        run: scripts\check-windows-cpu-tiers.ps1 target\debug
      - run: cargo test --locked
      - uses: actions/upload-artifact@v5
        with:
          name: scrawl-windows-x86_64
          path: |
            target/debug/scrawl.exe
            target/debug/transcribe.dll
            target/debug/ggml*.dll

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install the build dependencies
        run: ./scripts/linux/dependencies.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo build --locked
      - run: cargo test --locked
      - name: Check CPU tier instructions
        # dlopen-only CPU tiers are checked before linuxdeploy strips symbols.
        run: python3 scripts/linux/check-cpu-tiers.py target/debug
      - name: Package the AppImage
        run: ./scripts/linux/appimage.sh target/debug/scrawl
      - name: AppImage runs headless without FUSE
        run: APPIMAGE_EXTRACT_AND_RUN=1 target/appimage/Scrawl-x86_64.AppImage --help
      - uses: actions/upload-artifact@v5
        with:
          name: scrawl-linux-x86_64
          path: target/appimage/Scrawl-x86_64.AppImage
