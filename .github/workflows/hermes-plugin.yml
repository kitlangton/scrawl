name: Hermes plugin checks
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  python:
    # The agent whose run hits the limit owns optimization; never raise it.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10.2,<13'
      - run: python -m unittest discover -s hermes/tests -v
