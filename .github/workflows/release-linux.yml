name: Release (Linux)

on:
  workflow_run:
    workflows: [Linux verification]
    branches: [main]
    types: [completed]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact Linux-verified main SHA for a Main preview or feed repair (empty selects dispatch commit).
        required: false
        default: ""
      bridge_commit:
        description: One-time signed compatibility bridge commit; aliases already verified v2 assets.
        required: false
        default: ""
      tag:
        description: Version tag to build and attach to its release. Leave empty only for a Main preview.
        required: false
        default: ""
      publish_main:
        description: Publish a checked main build as a Linux preview release.
        type: boolean
        required: false
        default: false
      verify_only:
        description: Run both Linux packaging gates without publishing release assets. Requires empty tag and publish_main=false.
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read

jobs:
  admit:
    if: github.repository == 'tryapparent/apparent' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository))
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - name: Verification runtime budget and ownership
        working-directory: ${{ runner.temp }}
        shell: bash
        run: echo '10 minute whole-workflow execution budget (runner queue excluded; parallel jobs count once). Per-job timeout is an additional safeguard. If exceeded, optimize the tests. The agent whose run hits the limit owns optimization and a successful rerun; do not raise or bypass the limit.'
      # Admission code comes from trusted main, never an unchecked event SHA.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # Keep complete ancestry/tags without downloading historical file bodies.
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - name: Bridge publication contracts
        run: node --experimental-strip-types --test capture/desktop/scripts/linux/maintenance/signing-bridge.test.ts
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_SHA: ${{ inputs.candidate_sha || github.event.workflow_run.head_sha || github.sha }}
          VERIFY_RUN_ID: ${{ github.event.workflow_run.id }}
          TAG: ${{ inputs.tag }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
          BRIDGE_COMMIT: ${{ inputs.bridge_commit }}
          SELECTED_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$SELECTED_SHA" ]]; then
            [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" == refs/heads/main && -z "$TAG" && "$VERIFY_ONLY" != true && -z "$BRIDGE_COMMIT" ]]
          fi
          if [[ -n "$BRIDGE_COMMIT" ]]; then
            [[ "$GITHUB_REF" == refs/heads/main && -z "$TAG" && "$VERIFY_ONLY" != true ]]
            REQUEST_SHA=$(node --experimental-strip-types capture/desktop/scripts/linux/maintenance/signing-bridge.ts inspect "$BRIDGE_COMMIT")
          fi
          if [[ "$VERIFY_ONLY" == true ]]; then
            echo "sha=$REQUEST_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n "$TAG" ]]; then
            REQUEST_SHA=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          fi
          args=(--platform linux --sha "$REQUEST_SHA")
          if [[ -n "$VERIFY_RUN_ID" ]]; then args+=(--run-id "$VERIFY_RUN_ID"); fi
          python3 enablement/release_gate.py "${args[@]}"

  preview-needed:
    needs: admit
    if: needs.admit.outputs.sha != '' && inputs.bridge_commit == ''
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Verification runtime budget and ownership
        working-directory: ${{ runner.temp }}
        shell: bash
        run: echo '10 minute whole-workflow execution budget (runner queue excluded; parallel jobs count once). Per-job timeout is an additional safeguard. If exceeded, optimize the tests. The agent whose run hits the limit owns optimization and a successful rerun; do not raise or bypass the limit.'
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.admit.outputs.sha }}
          PUBLISH_MAIN: ${{ github.event_name == 'workflow_run' || github.event_name == 'schedule' || inputs.publish_main }}
          TAG: ${{ inputs.tag }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
        run: |
          if [[ "$VERIFY_ONLY" == "true" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [[ "$PUBLISH_MAIN" == "true" && -z "$TAG" ]] && \
             [[ "$(gh release view "linux-main-v2-$CANDIDATE_SHA" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)" == "false" ]]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
  linux:
    # Supersede expensive automatic builds only after exact-SHA admission.
    concurrency:
      group: release-linux-build-${{ github.ref }}-${{ matrix.arch }}-${{ github.event_name == 'workflow_run' && 'automatic' || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'workflow_run' }}
    needs: [admit, preview-needed]
    if: needs.preview-needed.outputs.build == 'true'
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      CANDIDATE_SHA: ${{ needs.admit.outputs.sha }}
      # workflow_run's event SHA may be newer than the admitted checkout.
      TAG: ${{ inputs.tag }}
      PUBLISH_MAIN: ${{ github.event_name == 'workflow_run' || github.event_name == 'schedule' || inputs.publish_main }}
      VERIFY_ONLY: ${{ inputs.verify_only }}
    steps:
      - name: Verification runtime budget and ownership
        working-directory: ${{ runner.temp }}
        shell: bash
        run: echo '10 minute whole-workflow execution budget (runner queue excluded; parallel jobs count once). Per-job timeout is an additional safeguard. If exceeded, optimize the tests. The agent whose run hits the limit owns optimization and a successful rerun; do not raise or bypass the limit.'
      - name: Validate release request
        run: |
          if [[ "$VERIFY_ONLY" == "true" ]]; then
            if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" || -n "$TAG" || "$PUBLISH_MAIN" == "true" || "$GITHUB_REF" != refs/heads/* ]]; then
              echo "Verify-only requires workflow_dispatch on a branch, with an empty tag and publish_main=false" >&2
              exit 1
            fi
          elif [[ ( "$PUBLISH_MAIN" == "true" && ( -n "$TAG" || "$GITHUB_REF" != "refs/heads/main" ) ) || ( "$PUBLISH_MAIN" != "true" && -z "$TAG" ) ]]; then
            echo "Select exactly one: a release tag, or a Main preview on main" >&2
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.admit.outputs.sha }}
      - name: Confirm build identity
        if: env.TAG == ''
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Install build and packaging dependencies
        run: ./capture/desktop/scripts/linux/appimage/dependencies.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux-${{ matrix.arch }}
          cache-on-failure: true
      - name: Build with PostHog error reporting
        env:
          APPARENT_POSTHOG_TOKEN: ${{ secrets.APPARENT_POSTHOG_TOKEN }}
        run: GITHUB_SHA="$CANDIDATE_SHA" cargo build --release --locked
      - name: Unit tests and model test executable
        run: |
          GITHUB_SHA="$CANDIDATE_SHA" cargo test --release --locked -- --test-threads=2
          GITHUB_SHA="$CANDIDATE_SHA" cargo test --release --locked speech:: -- --nocapture
          GITHUB_SHA="$CANDIDATE_SHA" cargo test --release --locked --bin apparent --no-run --message-format=json > target/test-artifacts.jsonl
          test=$(jq -r 'select(.reason == "compiler-artifact" and .target.name == "apparent" and .profile.test) | .executable // empty' target/test-artifacts.jsonl)
          test -f "$test"
          echo "SPEECH_TEST=$test" >> "$GITHUB_ENV"
      - name: No build-machine CPU specialization
        run: |
          mapfile -t caches < <(jq -r 'select(.reason == "build-script-executed" and (.package_id | contains("transcribe-cpp-sys"))) | .out_dir + "/build/CMakeCache.txt"' target/test-artifacts.jsonl)
          test "${#caches[@]}" -gt 0
          for cache in "${caches[@]}"; do
            grep -x 'GGML_NATIVE:BOOL=OFF' "$cache"
            grep -x 'GGML_BACKEND_DL:BOOL=ON' "$cache"
          done
      - name: CPU tiers contain only their declared instructions
        if: matrix.arch == 'x86_64'
        run: python3 capture/desktop/scripts/linux/appimage/check-cpu-tiers.py target/release
      - name: Package
        id: package
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ -n "$TAG" && "$TAG" != "v$version" ]]; then
            echo "Tag $TAG does not match Cargo.toml $version" >&2
            exit 1
          fi
          ./capture/desktop/scripts/linux/appimage/appimage.sh target/release/apparent
          name="Apparent-$version-linux-${{ matrix.arch }}.AppImage"
          mkdir -p dist
          cp "target/appimage/Apparent-${{ matrix.arch }}.AppImage" "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: AppImage runs headless without FUSE
        run: APPIMAGE_EXTRACT_AND_RUN=1 "dist/${{ steps.package.outputs.name }}" --help
      - name: Bundled GStreamer decodes an H.264 MP4
        run: bash capture/desktop/scripts/linux/appimage/check-appimage-decoder.sh "dist/${{ steps.package.outputs.name }}"
      - name: Bundled GStreamer encodes a playable H.264 MP4
        run: bash capture/desktop/scripts/linux/appimage/check-appimage-encoder.sh "dist/${{ steps.package.outputs.name }}"
      - name: Run two seconds of audio with the packaged CPU backend
        run: bash capture/desktop/scripts/linux/appimage/smoke-cpu.sh "dist/${{ steps.package.outputs.name }}" "$SPEECH_TEST"
      - uses: petarpetrovt/setup-sde@v6.0
        if: matrix.arch == 'x86_64'
      - name: Run packaged model on Ice Lake (AVX512-VNNI, no AVX-VNNI)
        if: matrix.arch == 'x86_64'
        timeout-minutes: 30
        env:
          APPARENT_TEST_NO_AVX_VNNI: "1"
        run: |
          sde=$(find "$SDE_PATH" -type f -name sde64 -print -quit)
          test -x "$sde"
          # Pin needs this on Ubuntu 24.04 runners.
          sudo sysctl -w kernel.yama.ptrace_scope=0
          bash capture/desktop/scripts/linux/appimage/smoke-cpu.sh "dist/${{ steps.package.outputs.name }}" "$SPEECH_TEST" "$sde" -icl
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/*

  publish:
    # One transaction keeps immutable publication and feed repair together.
    # Pending transactions may coalesce; running publication is never canceled.
    concurrency:
      group: release-linux-publication
      cancel-in-progress: false
    needs: [admit, preview-needed, linux]
    if: always() && needs.admit.result == 'success' && needs.admit.outputs.sha != '' && inputs.verify_only != true && (needs.linux.result == 'success' || needs.preview-needed.outputs.build == 'false' || inputs.bridge_commit != '')
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PUBLISH_MAIN: ${{ github.event_name == 'workflow_run' || github.event_name == 'schedule' || inputs.publish_main }}
      TAG: ${{ inputs.tag }}
      BRIDGE_COMMIT: ${{ inputs.bridge_commit }}
    steps:
      - name: Verification runtime budget and ownership
        working-directory: ${{ runner.temp }}
        shell: bash
        run: echo '10 minute whole-workflow execution budget (runner queue excluded; parallel jobs count once). Per-job timeout is an additional safeguard. If exceeded, optimize the tests. The agent whose run hits the limit owns optimization and a successful rerun; do not raise or bypass the limit.'
      - uses: actions/checkout@v5
        with:
          # Publication policy always comes from trusted current main.
          ref: main
          fetch-depth: 0
          # Feed ordering needs full history, not obsolete historical file bodies.
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - name: Validate metadata contracts
        run: node --experimental-strip-types --test capture/desktop/scripts/linux/maintenance/main-feed.test.ts
      - uses: actions/download-artifact@v5
        if: needs.linux.result == 'success' && env.BRIDGE_COMMIT == ''
        with:
          pattern: Apparent-*.AppImage
          path: dist
          merge-multiple: true
      - name: Attach to the release
        if: needs.linux.result == 'success' && env.TAG != '' && env.BRIDGE_COMMIT == ''
        env:
          CANDIDATE_SHA: ${{ needs.admit.outputs.sha }}
          TAG: ${{ inputs.tag }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # A moved tag must not label artifacts built from another commit.
          test "$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)" = "$CANDIDATE_SHA"
          # Another publisher may create it concurrently. Re-read on a create conflict.
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --verify-tag --title "Apparent ${TAG#v}" --notes "Release notes to follow." || \
            gh release view "$TAG" >/dev/null
          gh release upload "$TAG" dist/* --clobber

      - name: Publish both checked AppImages
        if: needs.linux.result == 'success' && env.PUBLISH_MAIN == 'true' && env.TAG == '' && env.BRIDGE_COMMIT == '' && github.ref == 'refs/heads/main'
        env:
          CANDIDATE_SHA: ${{ needs.admit.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Never put a pre-migration updater into the corrected feed.
          git show "$CANDIDATE_SHA:capture/desktop/linux/updates/update.rs" | grep -F 'strip_prefix("linux-main-v2-")'
          version=$(git show "$CANDIDATE_SHA:Cargo.toml" | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          GITHUB_SHA="$CANDIDATE_SHA" APPARENT_VERSION="$version" python3 capture/desktop/scripts/linux/maintenance/publish-main-preview.py

      - name: Publish admitted immutable artifact identities and complete ancestry
        if: env.PUBLISH_MAIN == 'true' && env.TAG == '' && env.BRIDGE_COMMIT == '' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.admit.outputs.sha }}
        run: |
          # The preceding publisher creates its immutable tag after checkout.
          # Refresh all release tags for candidate identity and ancestry checks.
          git fetch --tags origin
          node --experimental-strip-types capture/desktop/scripts/linux/maintenance/main-feed.ts "$CANDIDATE_SHA"

      - name: Publish unchanged verified assets for legacy updaters
        if: env.BRIDGE_COMMIT != '' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          BRIDGE_COMMIT: ${{ inputs.bridge_commit }}
        run: node --experimental-strip-types capture/desktop/scripts/linux/maintenance/signing-bridge.ts publish "$BRIDGE_COMMIT"

  runtime-budget:
    if: always()
    needs: [admit, preview-needed, linux, publish]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/runtime-budget.yml
