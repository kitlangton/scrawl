name: Release (Windows)

# Builds the Windows zip for a version tag and attaches it to that tag's GitHub release
# (creating the release if the Mac side hasn't yet). A release/** branch only builds it, as a
# dry run. Run it by hand with a tag to rebuild one, or without a tag to only build the zip and
# keep it as a workflow artifact.

on:
  push:
    tags: ["v*"]
    # A release branch builds the zip as a dry run, without uploading it.
    branches: ["release/**"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and attach the zip to (e.g. v0.3.6). Empty builds the branch without uploading.
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}-${{ inputs.tag }}

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
      BUILD: --release --locked --target x86_64-pc-windows-msvc
      EXE: target\x86_64-pc-windows-msvc\release\scrawl.exe
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
          cache-on-failure: true

      - run: cargo build ${{ env.BUILD }}

      - name: scrawl --help runs headless
        run: '& $env:EXE --help'

      - name: No AVX-512 outside the CPU backends that need it
        run: scripts\check-windows-cpu-tiers.ps1 target\x86_64-pc-windows-msvc\release

      # transcribe.cpp builds against the DLL C runtime, so the Visual C++ runtime DLLs scrawl.exe
      # and transcribe.cpp's DLLs import go beside them in the zip (app-local, as Microsoft
      # allows): a fresh Windows has no Visual C++ redistributable.
      # A fresh runner has no Scrawl config, so the app opens the welcome window. Scrawl leaves its
      # own windows out of screen captures unless SCRAWL_SHOW_OWN_WINDOWS is set.
      - name: The welcome window opens on a fresh profile
        shell: pwsh
        env:
          SCRAWL_SHOW_OWN_WINDOWS: "1"
        run: |
          $app = Start-Process -FilePath $env:EXE -ArgumentList "app" -PassThru
          Start-Sleep -Seconds 12
          if ($app.HasExited) { throw "Scrawl exited with code $($app.ExitCode)" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          New-Item -ItemType Directory -Force dist | Out-Null
          $bitmap.Save("dist\welcome.png")
          Stop-Process -Id $app.Id -Force
          $log = Join-Path $env:LOCALAPPDATA "Scrawl\Logs\scrawl.log"
          if (Test-Path $log) { Get-Content $log -Tail 40 }
          if ((Test-Path $log) -and (Select-String -Path $log -Pattern "onboarding: could not decode state" -Quiet)) {
            throw "the welcome window rejected the onboarding state"
          }
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: welcome-window
          path: dist/welcome.png
          if-no-files-found: warn

      - name: Collect the Visual C++ runtime DLLs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $files = @($env:EXE) + (Get-ChildItem target\x86_64-pc-windows-msvc\release\transcribe.dll, target\x86_64-pc-windows-msvc\release\ggml*.dll).FullName
          $deps = $files | ForEach-Object { & $dumpbin.FullName /nologo /dependents $_ } | Where-Object { $_ -match '^\s+\S+\.dll\s*$' } | ForEach-Object { $_.Trim() } | Sort-Object -Unique
          "imports:"; $deps
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          "runtime from $($crt.FullName)"
          New-Item -ItemType Directory -Force runtime | Out-Null
          foreach ($dll in $deps | Where-Object { $_ -match '^(vcruntime|msvcp|concrt|vcomp)' }) {
            $file = Join-Path $crt.FullName $dll
            if (-not (Test-Path $file)) { throw "no $dll in $($crt.FullName)" }
            Copy-Item $file runtime\
          }
          Get-ChildItem runtime | Format-Table Name, Length

      - name: Downloads and runs the speech model
        env:
          SCRAWL_TEST_MODEL_DIR: ${{ runner.temp }}\speech-model
        run: cargo test ${{ env.BUILD }} speech -- --ignored --nocapture

      # The runner has AVX-512; Intel SDE runs the model again as a Lunar Lake CPU (AVX2 and
      # AVX-VNNI, no AVX-512), the one that crashed in #58. ggml then loads the alderlake backend.
      - uses: petarpetrovt/setup-sde@v6.0
      - name: Runs the speech model on a CPU without AVX-512
        timeout-minutes: 30
        shell: pwsh
        env:
          SCRAWL_TEST_MODEL_DIR: ${{ runner.temp }}\speech-model
          SCRAWL_TEST_NO_AVX512: "1"
        run: |
          $test = cargo test ${{ env.BUILD }} --bin scrawl --no-run --message-format=json |
            ForEach-Object { $_ | ConvertFrom-Json } |
            Where-Object { $_.reason -eq "compiler-artifact" -and $_.target.name -eq "scrawl" -and $_.profile.test } |
            Select-Object -ExpandProperty executable -First 1
          "test binary: $test"
          $sde = Get-ChildItem $env:SDE_PATH -Recurse -Filter sde.exe | Select-Object -First 1
          & $sde.FullName -lnl -- $test speech::tests::downloads_and_runs_parakeet --exact --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw "failed under SDE -lnl (exit $LASTEXITCODE)" }

      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $name = "Scrawl-$version-windows-x64.zip"
          $dir = "dist\Scrawl"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item $env:EXE "$dir\scrawl.exe"
          Copy-Item target\x86_64-pc-windows-msvc\release\transcribe.dll, target\x86_64-pc-windows-msvc\release\ggml*.dll $dir
          Copy-Item runtime\*.dll $dir
          Copy-Item LICENSE "$dir\LICENSE.txt"
          @"
          Scrawl $version for Windows (preview)

          Run scrawl.exe, keeping the DLLs beside it. Scrawl lives in the notification area;
          press Alt+Shift+S to record.

          This build isn't signed yet, so Windows may say "Windows protected your PC".
          Click More info, then Run anyway.

          The first launch downloads the speech model (730 MB) in the background, unless Hex
          already installed one. Captures made before it finishes get their transcript afterwards.

          https://scrawl.kitlangton.com
          https://github.com/kitlangton/scrawl
          "@ | Set-Content -Encoding utf8 "$dir\README.txt"
          Compress-Archive -Path $dir -DestinationPath "dist\$name" -Force
          Get-ChildItem dist\$name | Format-Table Name, Length
          (Get-FileHash "dist\$name" -Algorithm SHA256).Hash.ToLower() + "  $name" | Tee-Object "dist\$name.sha256"
          "name=$name" >> $env:GITHUB_OUTPUT

      - name: Check the zip
        shell: pwsh
        run: |
          Expand-Archive "dist\${{ steps.package.outputs.name }}" -DestinationPath dist\check -Force
          Get-ChildItem -Recurse dist\check | Format-Table FullName, Length
          dist\check\Scrawl\scrawl.exe --version

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/${{ steps.package.outputs.name }}
            dist/${{ steps.package.outputs.name }}.sha256

      - name: Attach to the release
        if: env.TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "Scrawl ${TAG#v}" --notes "Release notes to follow."
          gh release upload "$TAG" "dist/${{ steps.package.outputs.name }}" "dist/${{ steps.package.outputs.name }}.sha256" --clobber
