name: engine-media-native delivery
on:
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'capture/engine/**'
      - '.cargo/**'
      - '.github/workflows/stream-engine-media-native.yml'
      - 'composition/delivery/**'
      - 'composition/architecture/**'
      - '.github/workflows/value-stream-delivery.yml'
      - '.github/actions/runtime-budget/**'
      - 'enablement/verification/workflow-budget.ts'
      - 'LICENSE'
permissions:
  contents: read
jobs:
  deliver:
    if: github.repository == 'tryapparent/apparent' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/value-stream-delivery.yml
    with:
      owner_id: 'engine-media-native'
      targets: '{"include":[{"id":"engine-media-native","target":"linux-x64","runner":"ubuntu-24.04","kind":"directory","stage":"library","package":"engine/delivery/media","verify":["verify"],"build":"build","language":"native","packageManager":"npm","architecture_owner":"engine"}]}'
      workflow_path: '.github/workflows/stream-engine-media-native.yml'
