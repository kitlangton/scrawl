name: Website and Connect — checks & deploy

on:
  workflow_run:
    workflows: [Linux verification]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Never cancel a deployment halfway through publication. Every publisher also
# checks ancestry against the deployed revision while this lock is held.
concurrency:
  group: web-delivery-production-${{ github.event_name == 'workflow_run' && (github.event.workflow_run.conclusion != 'success' || github.event.workflow_run.event != 'push' || github.event.workflow_run.head_repository.full_name != github.repository) && github.run_id || 'eligible' }}
  cancel-in-progress: false

jobs:
  admit:
    if: github.repository == 'tryapparent/apparent' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository))
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - name: Verification runtime budget and ownership
        working-directory: ${{ runner.temp }}
        shell: bash
        run: echo '10 minute whole-workflow execution budget (runner queue excluded; parallel jobs count once). Per-job timeout is an additional safeguard. If exceeded, optimize the tests. The agent whose run hits the limit owns optimization and a successful rerun; do not raise or bypass the limit.'
      # Admission code comes from trusted main, never an unchecked event SHA.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          VERIFY_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--platform linux --sha "$REQUEST_SHA")
          if [[ -n "$VERIFY_RUN_ID" ]]; then args+=(--run-id "$VERIFY_RUN_ID"); fi
          python3 enablement/release_gate.py "${args[@]}"

  verify:
    needs: admit
    if: needs.admit.outputs.sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PUBLIC_POSTHOG_ENABLED: ${{ vars.PUBLIC_POSTHOG_ENABLED || 'true' }}
      PUBLIC_POSTHOG_TOKEN: ${{ vars.PUBLIC_POSTHOG_TOKEN }}
      PUBLIC_POSTHOG_HOST: https://eu.i.posthog.com
      PUBLIC_POSTHOG_ENVIRONMENT: production
    steps:
      - name: Verification runtime budget and ownership
        working-directory: ${{ runner.temp }}
        shell: bash
        run: echo '10 minute whole-workflow execution budget (runner queue excluded; parallel jobs count once). Per-job timeout is an additional safeguard. If exceeded, optimize the tests. The agent whose run hits the limit owns optimization and a successful rerun; do not raise or bypass the limit.'
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.admit.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
          cache: npm
          cache-dependency-path: connect/service/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Test publication contracts
        run: python3 -m unittest discover -s public/site/scripts/cd -p 'test_*.py'
      - name: Verify Worker in local workerd with synthetic accounts
        working-directory: connect/service
        run: npm ci && npm test
      - name: Install locked website dependencies and browser
        working-directory: public/site
        run: |
          bun install --frozen-lockfile
          ./node_modules/.bin/playwright-core install --with-deps chromium firefox
          echo "CHROME_PATH=$(node --input-type=module -e 'import {chromium} from "playwright-core"; console.log(chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Independently build and verify Connect browser package
        working-directory: connect/web
        env:
          VITE_HOSTED_API_ORIGIN: https://hosted.tryapparent.com
          CONNECT_EVIDENCE: ${{ runner.temp }}/connect-package-evidence
        run: bun install --frozen-lockfile && npm test
      - name: Build and test production website package
        working-directory: public/site
        env:
          APPARENT_PUBLIC_SITE: '1'
          VITE_HOSTED_API_ORIGIN: https://hosted.tryapparent.com
        run: |
          npm run build
          node scripts/site-build/package-apparent.mjs
          node --test scripts/brand/test-brand-favicon.mjs scripts/browser-proof/test-github-stars.mjs scripts/pages/test-latest-download.mjs scripts/pages/test-platform-os.mjs scripts/pages/test-public-homepage.ts scripts/browser-proof/test-video-demo.mjs
          node --test scripts/commerce/test-package-text.mjs scripts/site-build/test-expected-canonical-packaging.mjs scripts/browser-proof/test-upstream-link-guard.mjs scripts/browser-proof/test-og-stage-redirect.mjs scripts/browser-proof/test-og-video-stage-browser.mjs
          cp -a dist-apparent "$RUNNER_TEMP/public-artifact"
          node scripts/connect/compose-connect.mjs
      - name: Verify default-enabled analytics with isolated synthetic transport
        working-directory: connect/web
        env:
          CONNECT_EVIDENCE: ${{ runner.temp }}/analytics-browser-evidence
        run: npm run test:analytics
      - name: Prepare source-built Pages artifact
        working-directory: public/site
        run: |
          node --test scripts/connect/test-compose-connect.mjs scripts/pages/test-pages-package.ts scripts/pages/test-pages-video.mjs scripts/pages/test-pages-video-runtime.mjs
          node scripts/pages/prepare-pages.ts
          COMPOSE_PUBLIC_INPUT="$RUNNER_TEMP/public-artifact" node scripts/site-build/verify-composed.ts
          PUBLIC_THEME_ARTIFACT=public/site/dist-apparent THEME_SURFACES=public,connect,recipient node ../../shared/ui/test/appearance.mjs
          node scripts/pages/prepare-pages-video.mjs
          ../../connect/service/node_modules/.bin/esbuild lib/pages-worker.ts --bundle --platform=browser --format=esm --outfile=dist-apparent/_worker.js
          PAGES_WORKER=dist-apparent/_worker.js node --test scripts/pages/test-pages-video-runtime.mjs
          SITE_ARTIFACT=dist-apparent node --test scripts/pages/test-public-homepage.ts
          python3 scripts/cd/publish_pages.py seal ${{ needs.admit.outputs.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: website-${{ needs.admit.outputs.sha }}
          path: .build/website/
          if-no-files-found: error
          # The checked public demos use .local-media; do not drop their assets.
          include-hidden-files: true
          retention-days: 90
      - name: Verify Connect browser behavior across credentialed origins
        working-directory: public/site
        env:
          APPARENT_PUBLIC_SITE: '1'
          VITE_HOSTED_API_ORIGIN: http://127.0.0.1:18809
          HOSTED_TEST_API_ORIGIN: http://127.0.0.1:18809
          COMPOSE_SYNTHETIC_ORIGIN: http://127.0.0.1:18809
          COMPOSE_PUBLIC_INPUT: ${{ runner.temp }}/public-artifact
          SITE_ARTIFACT: dist/synthetic-composition
          TMPDIR: ${{ runner.temp }}
          SITE_EVIDENCE: ${{ runner.temp }}/connect-evidence
        run: |
          (cd ../../connect/web && CONNECT_BUILD_DIR=dist-test npm run build)
          node scripts/connect/compose-connect.mjs
          node scripts/pages/prepare-pages.ts
          node scripts/site-build/verify-composed.ts
          npm run test:hosted
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: synthetic-connect-evidence
          path: ${{ runner.temp }}/connect-evidence/
          retention-days: 3
          if-no-files-found: ignore

  website:
    needs: [admit, verify]
    if: github.repository == 'tryapparent/apparent' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.WEBSITE_CD_ENABLED == 'true'
    environment:
      name: website-production
      url: https://app.tryapparent.com
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verification runtime budget and ownership
        working-directory: ${{ runner.temp }}
        shell: bash
        run: echo '10 minute whole-workflow execution budget (runner queue excluded; parallel jobs count once). Per-job timeout is an additional safeguard. If exceeded, optimize the tests. The agent whose run hits the limit owns optimization and a successful rerun; do not raise or bypass the limit.'
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.admit.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: website-${{ needs.admit.outputs.sha }}
          path: .build/website
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
          cache: npm
          cache-dependency-path: connect/service/package-lock.json
      - run: npm ci
        working-directory: connect/service
      - name: Publish checked main to Cloudflare Pages (never Clanker or the Worker)
        env:
          GH_TOKEN: ${{ github.token }}
          WEBSITE_PAGES_API_TOKEN: ${{ secrets.WEBSITE_PAGES_API_TOKEN }}
        run: GITHUB_SHA="${{ needs.admit.outputs.sha }}" python3 public/site/scripts/cd/publish_pages.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-deployment-receipt
          path: website-receipt.json
          if-no-files-found: ignore

  hosted:
    needs: [admit, verify]
    if: github.repository == 'tryapparent/apparent' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.HOSTED_CD_ENABLED == 'true'
    environment:
      name: hosted-production
      url: https://hosted.tryapparent.com
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      HOSTED_WORKER_NAME: ${{ vars.HOSTED_WORKER_NAME }}
      HOSTED_D1_NAME: ${{ vars.HOSTED_D1_NAME }}
      HOSTED_D1_ID: ${{ vars.HOSTED_D1_ID }}
      HOSTED_R2_BUCKET: ${{ vars.HOSTED_R2_BUCKET }}
      POSTHOG_ENABLED: ${{ vars.POSTHOG_ENABLED || 'true' }}
      SHARING_ENABLED: ${{ vars.SHARING_ENABLED || 'true' }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Verification runtime budget and ownership
        working-directory: ${{ runner.temp }}
        shell: bash
        run: echo '10 minute whole-workflow execution budget (runner queue excluded; parallel jobs count once). Per-job timeout is an additional safeguard. If exceeded, optimize the tests. The agent whose run hits the limit owns optimization and a successful rerun; do not raise or bypass the limit.'
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.admit.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
          cache: npm
          cache-dependency-path: connect/service/package-lock.json
      - run: npm ci && npm run build
        working-directory: connect/service
      - name: Render approved resource bindings (never apply migrations)
        run: python3 public/site/scripts/cd/hosted_config.py
      - name: Check source ordering under the publication lock
        id: order
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 public/site/scripts/cd/verify_worker.py --publication-needed "${{ needs.admit.outputs.sha }}"
      - name: Deploy checked main and read back version and anonymous CORS
        if: steps.order.outputs.publish == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          export GITHUB_SHA="${{ needs.admit.outputs.sha }}"
          test -n "$CLOUDFLARE_API_TOKEN"
          cd connect/service
          ./node_modules/.bin/wrangler deploy --config wrangler.cd.json --tag "$GITHUB_SHA" --message "GitHub Actions $GITHUB_RUN_ID commit $GITHUB_SHA" --strict --no-autoconfig
          cd ../..
          python3 public/site/scripts/cd/verify_worker.py "$GITHUB_SHA" > connect-service-receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-deployment-receipt
          path: connect-service-receipt.json
          if-no-files-found: ignore

  runtime-budget:
    if: always()
    needs: [admit, verify, website, hosted]
    permissions:
      contents: read
      actions: read
    name: Workflow runtime budget
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: ./.github/actions/runtime-budget
