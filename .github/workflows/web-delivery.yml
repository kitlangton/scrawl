name: Connect publication follow-up

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  worker:
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    if: github.repository == 'tryapparent/apparent' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Connect producer' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && vars.HOSTED_CD_ENABLED == 'true'
    uses: ./.github/workflows/connect-delivery.yml
    with:
      producer-run: ${{ format('{0}', github.event.workflow_run.id) }}
    secrets: inherit

  runtime-budget:
    if: always()
    needs: [worker]
    permissions:
      contents: read
      actions: read
    name: Workflow runtime budget
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: ./.github/actions/runtime-budget
        with:
          platform: web
