[package]
name = "apparent-capture-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Shared capture admission, bundle leases, and optional Linux recording execution"

[features]
default = []
linux-media = ["dep:flume", "dep:anyhow", "dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video"]
linux-portal = ["linux-media", "dep:ashpd", "dep:futures-lite", "dep:zbus"]
publication = ["dep:anyhow", "dep:sha2", "dep:png"]
materials-media = ["dep:anyhow", "dep:sha2", "dep:png"]
macos-capture = ["dep:screencapturekit"]

[dependencies]
libc = "=0.2.189"
anyhow = { version = "=1.0.104", optional = true }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.10.9", optional = true }
png = { version = "=0.18.1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "=0.11.1", default-features = false, features = ["async-std"], optional = true }
futures-lite = { version = "=2.6.1", optional = true }
zbus = { version = "=5.19.0", default-features = false, features = ["async-io", "blocking-api"], optional = true }
flume = { version = "=0.12.0", optional = true }
gstreamer = { version = "=0.25.4", optional = true }
gstreamer-app = { version = "=0.25.2", optional = true }
gstreamer-video = { version = "=0.25.4", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "=11.0.0", features = ["macos_15_0"], optional = true }
