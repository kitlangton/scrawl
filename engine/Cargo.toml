[package]
name = "apparent-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Standalone native Engine provider for the Apparent v1 contract"

[[bin]]
name = "apparent-engine"
path = "src/main.rs"

[[bin]]
name = "apparent-engine-frames"
path = "src/frames.rs"
required-features = ["media"]

[features]
media = ["dep:libc", "dep:png", "dep:sha2", "dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video"]

[dependencies]
apparent-capture-engine = { path = "core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
libc = { version = "=0.2.189", optional = true }
png = { version = "=0.18.1", optional = true }
sha2 = { version = "=0.10.9", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gstreamer = { version = "=0.25.4", optional = true }
gstreamer-app = { version = "=0.25.2", optional = true }
gstreamer-video = { version = "=0.25.4", optional = true }
