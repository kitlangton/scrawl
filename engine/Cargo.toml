[package]
name = "apparent-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Standalone native Engine provider for the Apparent v1 contract"

[[bin]]
name = "apparent-engine"
path = "src/main.rs"

[dependencies]
apparent-capture-engine = { path = "../capture/engine" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
